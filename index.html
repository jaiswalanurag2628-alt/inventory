    // 2. CORE HELPER FUNCTIONS (FIFO, BATCH CONSOLIDATION, FORMATTING)
    // =========================================================================
    const formatINR = (num) => '₹' + Number(num || 0).toLocaleString('en-IN', { minimumFractionDigits: 0, maximumFractionDigits: 2 });
    const getAsset = (id) => state.assets.find(a => a.id === id);
    const getVendor = (id) => state.vendors.find(v => v.id === id);

    function getAggregatedStock(assetId) {
      return state.stockBatches
        .filter(b => b.assetId === assetId && b.leftQty > 0)
        .reduce((sum, b) => sum + b.leftQty, 0);
    }

    function addOrMergeBatch({ assetId, addedOn, expiry, variant, colour, qty, unitPrice }) {
      const existing = state.stockBatches.find(b =>
        b.assetId === assetId &&
        b.addedOn === addedOn &&
        (b.expiry || '') === (expiry || '') &&
        (b.variant || '-') === (variant || '-') &&
        Number(b.unitPrice) === Number(unitPrice)
      );
      if (existing) {
        existing.totalQty += Number(qty);
        existing.leftQty += Number(qty);
        return existing.batchId;
      }
      const newBatchId = `BCH-${assetId.replace('AST-', '')}-${state.stockBatches.length + 1}`;
      state.stockBatches.push({
        batchId: newBatchId,
        assetId,
        addedOn,
        expiry: expiry || '',
        variant: variant || '-',
        colour: colour || '-',
        totalQty: Number(qty),
        issuedQty: 0,
        leftQty: Number(qty),
        unitPrice: Number(unitPrice)
      });
      return newBatchId;
    }

    function deductStockFIFO(assetId, qtyToDeduct) {
      let remaining = Number(qtyToDeduct);
      const activeBatches = state.stockBatches
        .filter(b => b.assetId === assetId && b.leftQty > 0)
        .sort((a, b) => a.addedOn.localeCompare(b.addedOn));
      const consumedBatches = [];
      for (const batch of activeBatches) {
        if (remaining <= 0) break;
        const take = Math.min(batch.leftQty, remaining);
        batch.leftQty -= take;
        batch.issuedQty += take;
        remaining -= take;
        consumedBatches.push(`${batch.batchId} (${take})`);
      }
      return consumedBatches.join(', ');
    }

    function consolidateDuplicateBatches() {
      const merged = [];
      let mergedCount = 0;
      for (const b of state.stockBatches) {
        const match = merged.find(m =>
          m.assetId === b.assetId &&
          m.addedOn === b.addedOn &&
          (m.expiry || '') === (b.expiry || '') &&
          (m.variant || '-') === (b.variant || '-') &&
          Number(m.unitPrice) === Number(b.unitPrice)
        );
        if (match) {
          match.totalQty += b.totalQty;
          match.issuedQty += b.issuedQty;
          match.leftQty += b.leftQty;
          mergedCount++;
        } else {
          merged.push({ ...b });
        }
      }
      state.stockBatches = merged;
      if (mergedCount > 0) {
        showToast(`Consolidated ${mergedCount} duplicate batch row(s) into unified stock records!`, 'success');
      } else {
        showToast('All stock batches are already consolidated.', 'info');
      }
      if (state.activeRoute === 'asset-mgmt') renderAssetManagement(document.getElementById('workspace'));
    }

    function calculatePOTotals(po) {
      let subTotal = 0;
      let gstTotal = 0;
      (po.items || []).forEach(it => {
        const base = Number(it.qty) * Number(it.rate);
        const gst = base * (Number(it.gst || 0) / 100);
        subTotal += base;
        gstTotal += gst;
      });
      return { subTotal, gstTotal, grandTotal: subTotal + gstTotal };
    }

    function handleExcelUpload(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (evt) => {
        const wb = XLSX.read(evt.target.result, { type: 'binary' });
        const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);
        let imported = 0;
        let totalVal = 0;
        const today = new Date().toISOString().slice(0, 10);
        rows.forEach(r => {
          const code = String(r['Asset Code'] || '').trim();
          const name = cleanName(r['Asset Name'] || '');
          const qty = Number(r['Opening Stock Qty'] || 0);
          const rate = Number(r['Unit Rate'] || 0);
          if (!code || !name || qty <= 0) return;
          const newId = `AST-${Date.now().toString().slice(-4)}-${imported + 1}`;
          state.assets.push({
            id: newId,
            categoryId: r['Category'] || 'IT',
            code,
            name,
            brand: r['Brand'] || '-',
            unit: r['Unit'] || 'Pcs',
            minStock: Number(r['Minimum Stock'] || 2),
            unitPrice: rate,
            location: r['Location'] || 'Main Store',
            addedOn: today,
            expiry: r['Warranty/Expiry Date'] || ''
          });
          addOrMergeBatch({ assetId: newId, addedOn: today, expiry: r['Warranty/Expiry Date'] || '', variant: '-', colour: '-', qty, unitPrice: rate });
          totalVal += qty * rate;
          imported++;
        });
        if (imported > 0) {
          state.accountingLogs.unshift({
            time: new Date().toLocaleString('en-GB'),
            voucher: `OPN-${Math.floor(100 + Math.random() * 900)}`,

            amount: formatINR(totalVal),
            status: 'Synced'
          });
          updateAlertBadges();
          showToast(`Imported ${imported} assets (${formatINR(totalVal)}) into stock & Financial Accounting!`, 'success');
          renderAssets(document.getElementById('workspace'));
        }
      };
      reader.readAsBinaryString(file);
    }

    function handleIssueSubmit(e) {
      e.preventDefault();
      const req = state.requisitions.find(r => r.reqNo === window._selectedIssueReqNo);
      if (!req) return;
      const asset = getAsset(req.assetId);
      const qty = Number(document.getElementById('iss-qty').value);
      const leftCount = getAggregatedStock(asset.id);
      const remaining = req.requestedQty - req.issuedQty;

      if (qty <= 0 || qty > leftCount || qty > remaining) {
        return showToast(`Invalid quantity! Max allowed is ${Math.min(leftCount, remaining)}.`, 'error');
      }

      const batchInfo = deductStockFIFO(asset.id, qty);
      req.issuedQty += qty;
      const issueDate = document.getElementById('iss-date').value;
      const loc = document.getElementById('iss-loc').value;

      if (req.issuedQty >= req.requestedQty) {
        req.status = 'Completed (Item Issued)';
      }

      req.history.push({
        date: `${issueDate} ${new Date().toTimeString().slice(0, 5)}`,
        text: `Issued ${qty} ${asset.unit || 'unit(s)'} to ${req.requesterName} from ${loc} (${batchInfo}). Status: ${req.status}`
      });

      state.issueLogs.unshift({
        issueId: `ISS-${String(state.issueLogs.length + 42).padStart(4, '0')}`,
        date: issueDate,
        reqNo: req.reqNo,
        recipientName: req.requesterName,
        role: req.requesterRole,
        dept: req.dept,
        assetId: asset.id,
        location: loc,
        qty,
        unitPrice: asset.unitPrice,
        batchId: batchInfo,
        issuedBy: 'Storekeeper (Super Admin)'
      });

      updateAlertBadges();
      showToast(`Issued ${qty} ${cleanName(asset.name)} to ${req.requesterName}. Requisition marked "${req.status}"!`, 'success');
      renderIssuePage(document.getElementById('workspace'));
    }

    function submitPOGRN(poNo) {
      const po = state.purchaseOrders.find(p => p.poNo === poNo);
      if (!po) return;
      const grnDate = document.getElementById('grn-date').value;
      const loc = document.getElementById('grn-loc').value;
      const grnNo = `GRN-00${89 + state.accountingLogs.length}`;

      po.items.forEach(it => {
        const asset = getAsset(it.assetId);
        if (asset) {
          asset.location = loc;
          asset.unitPrice = it.rate;
          addOrMergeBatch({
            assetId: asset.id,
            addedOn: grnDate,
            expiry: asset.expiry || '',
            variant: it.variant,
            colour: it.colour,
            qty: it.qty,
            unitPrice: it.rate
          });
        }
      });

      po.status = 'Delivered (GRN completed)';
      po.grnNo = grnNo;
      const totals = calculatePOTotals(po);
      state.accountingLogs.unshift({
        time: new Date().toLocaleString('en-GB'),
        voucher: `PUR-${po.poNo}`,
        desc: `${grnNo} Verified -> Vendor Payable posted to ${getVendor(po.vendorId)?.name || 'Vendor'}`,
        amount: formatINR(totals.grandTotal),
        status: 'Synced'
      });

      updateAlertBadges();
      showToast(`${grnNo} completed! Stock added to ${loc} and payable synced to Financial Accounting.`, 'success');
      renderGRN(document.getElementById('workspace'));
    }

    function handleStockAdjustment(e, type) {
      e.preventDefault();
      const assetId = document.getElementById('adj-asset').value;
      const qty = Number(document.getElementById('adj-qty').value);
      const person = document.getElementById('adj-person').value.trim();
      const remarks = document.getElementById('adj-remarks').value.trim();
      const asset = getAsset(assetId);
      const today = new Date().toISOString().slice(0, 10);

      if (type === 'Return to Store') {
        addOrMergeBatch({ assetId, addedOn: today, expiry: asset.expiry || '', variant: '-', colour: '-', qty, unitPrice: asset.unitPrice });
      } else {
        if (qty > getAggregatedStock(assetId)) {
          return showToast('Damaged quantity exceeds available stock!', 'error');
        }
        deductStockFIFO(assetId, qty);
      }

      state.adjustments.unshift({
        id: `ADJ-${String(state.adjustments.length + 1).padStart(3, '0')}`,
        date: today,
        type,
        assetId,
        qty,
        person,
        remarks
      });
      closeModal();
      updateAlertBadges();
      showToast(`${type} recorded for ${cleanName(asset.name)} (${qty} units)!`, 'success');
      renderAssetManagement(document.getElementById('workspace'));
    }

    function updateAuditVariance(assetId, sysQty, unitPrice, physicalVal) {
      const phys = parseInt(physicalVal, 10);
      const varCell = document.getElementById(`audit-var-${assetId}`);
      const valCell = document.getElementById(`audit-val-${assetId}`);
      if (!varCell || !valCell) return;
      if (isNaN(phys)) {
        varCell.innerHTML = `<span class="text-slate-400">0</span>`;
        valCell.textContent = '₹0';
        return;
      }
      const diff = phys - sysQty;
      const diffVal = diff * unitPrice;
      if (diff === 0) {
        varCell.innerHTML = `<span class="text-emerald-600 font-bold">0 (Matched)</span>`;
      } else if (diff < 0) {
        varCell.innerHTML = `<span class="text-rose-600 font-extrabold">${diff} (Shortage)</span>`;
      } else {
        varCell.innerHTML = `<span class="text-sky-600 font-extrabold">+${diff} (Excess)</span>`;
      }
      valCell.textContent = (diffVal >= 0 ? '+' : '-') + formatINR(Math.abs(diffVal));
    }

    function reconcilePhysicalAudit() {
      const inputs = document.querySelectorAll('[id^="audit-phys-"]');
      let adjustedCount = 0;

      inputs.forEach(input => {
        const assetId = input.id.replace('audit-phys-', '');
        const asset = getAsset(assetId);
        if (!asset) return;
        const sysQty = getAggregatedStock(assetId);
        const physQty = parseInt(input.value, 10);
        if (isNaN(physQty) || physQty < 0 || physQty === sysQty) return;

        const diff = physQty - sysQty;
        const today = new Date().toISOString().slice(0, 10);
        if (diff > 0) {
          addOrMergeBatch({ assetId, addedOn: today, expiry: asset.expiry || '', variant: '-', colour: '-', qty: diff, unitPrice: asset.unitPrice });
        } else {
          deductStockFIFO(assetId, Math.abs(diff));
        }
        state.adjustments.unshift({
          id: `AUD-${String(state.adjustments.length + 1).padStart(3, '0')}`,
          date: today,
          type: diff > 0 ? 'Audit Excess' : 'Audit Shortage',
          assetId,
          qty: Math.abs(diff),
          person: 'Physical Audit Team',
          remarks: `Physical count (${physQty}) vs System (${sysQty})`
        });
        adjustedCount++;
      });

      if (adjustedCount === 0) {
        return showToast('No stock variances detected — all physical counts match system stock.', 'info');
      }
      updateAlertBadges();
      renderPhysicalAudit(document.getElementById('workspace'));
      showToast(`Reconciled ${adjustedCount} asset variance(s) and updated stock ledger!`, 'success');
    }

                  <th class="py-3 px-3 text-right">Profit / Loss</th>
                  <th class="py-3 px-3">Buyer</th>
                </tr>
              </thead>
              <tbody class="divide-y divide-slate-100">
                ${state.soldAssets.map(s => {
                  const a = getAsset(s.assetId);
                  const diff = s.saleAmount - s.bookValue;
                  return `
                    <tr class="hover:bg-slate-50">
                      <td class="py-2.5 px-3 font-mono font-bold">${s.saleId}</td>
                      <td class="py-2.5 px-3">${s.date}</td>
                      <td class="py-2.5 px-3 font-bold">${a ? cleanName(a.name) : s.assetId}</td>
                      <td class="py-2.5 px-3 text-center">${s.qty}</td>
                      <td class="py-2.5 px-3 text-right">${formatINR(s.bookValue)}</td>
                      <td class="py-2.5 px-3 text-right font-bold">${formatINR(s.saleAmount)}</td>
                      <td class="py-2.5 px-3 text-right font-extrabold ${diff >= 0 ? 'text-emerald-700' : 'text-rose-600'}">${diff >= 0 ? '+' : '-'}${formatINR(Math.abs(diff))}</td>
                      <td class="py-2.5 px-3">${s.buyer}</td>
                    </tr>
                  `;
                }).join('')}
              </tbody>
            </table>
          </div>
        </div>
      `;
    }

    function handleSoldAsset(e) {
      e.preventDefault();
      const asset = getAsset(document.getElementById('sld-asset').value);
      const qty = Number(document.getElementById('sld-qty').value);
      const saleAmount = Number(document.getElementById('sld-amt').value);
      const buyer = document.getElementById('sld-buyer').value.trim();
      if (!asset || qty > getAggregatedStock(asset.id)) {
        return showToast('Sale quantity exceeds available stock!', 'error');
      }
      deductStockFIFO(asset.id, qty);
      const bookValue = qty * asset.unitPrice;
      const saleId = `SLD-00${state.soldAssets.length + 1}`;
      state.soldAssets.unshift({
        saleId,
        date: new Date().toISOString().slice(0, 10),
        assetId: asset.id,
        qty,
        bookValue,
        saleAmount,
        buyer,
        remarks: 'Scrap disposal'
      });
      state.accountingLogs.unshift({
        time: new Date().toLocaleString('en-GB'),
        voucher: saleId,
        desc: `Scrap Sale to ${buyer} (${cleanName(asset.name)})`,
        amount: formatINR(saleAmount),
        status: 'Synced'
      });
      updateAlertBadges();
      showToast(`Scrap sale ${saleId} recorded and synced to Financial Accounting!`, 'success');
      renderSoldAssets(document.getElementById('workspace'));
    }

    // =========================================================================
    // 14. DEPARTMENT-WISE MONTHLY BUDGET SETTINGS
    // =========================================================================
    function renderDeptBudgetSettings(ws) {
      ws.innerHTML = `
        <div class="bg-white rounded-2xl p-6 border border-slate-200 shadow-2xs space-y-5">
          <div>
            <h2 class="font-display font-bold text-brand-orange text-lg">Department-Wise Monthly Budget Settings</h2>
            <p class="text-xs text-slate-500">Add a new department or update the monthly consumption limit (₹) for existing departments.</p>
          </div>

          <form onsubmit="handleSaveDeptBudget(event)" class="grid grid-cols-1 sm:grid-cols-3 gap-4 text-xs bg-sky-50/70 p-4 rounded-xl border border-sky-200">
            <div>
              <label class="block font-bold text-brand-navy mb-1">* Department Name</label>
              <input id="bdg-dept" required placeholder="e.g. Science Lab / Sports" class="w-full px-3 py-2 border border-slate-300 rounded-xl bg-white" />
            </div>
            <div>
              <label class="block font-bold text-brand-navy mb-1">* Monthly Budget Cap (₹)</label>
              <input id="bdg-cap" type="number" min="500" step="500" required placeholder="e.g. 15000" class="w-full px-3 py-2 border border-slate-300 rounded-xl bg-white font-bold" />
            </div>
            <div class="flex items-end">
              <button type="submit" class="w-full py-2.5 rounded-xl bg-brand-blue hover:bg-brand-navy text-white font-bold shadow-xs">Add / Update Department Budget</button>
            </div>
          </form>

          <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse text-xs">
              <thead>
                <tr class="border-b-2 border-slate-200 text-brand-blue font-bold bg-slate-50">
                  <th class="py-3 px-3">Department</th>
                  <th class="py-3 px-3 text-right">Monthly Budget Cap (₹)</th>
                  <th class="py-3 px-3 text-right">Consumed This Month</th>
                  <th class="py-3 px-3 text-right">Remaining Balance</th>
                  <th class="py-3 px-3 text-center">Utilization %</th>
                  <th class="py-3 px-3 text-right">Quick Edit</th>
                </tr>
              </thead>
              <tbody class="divide-y divide-slate-100">
                ${state.deptBudgets.map((b, idx) => {
                  const used = state.issueLogs.filter(l => l.dept === b.dept).reduce((s, l) => s + l.qty * l.unitPrice, 0);
                  const rem = b.monthlyCap - used;
                  const pct = b.monthlyCap > 0 ? Math.min(100, Math.round((used / b.monthlyCap) * 100)) : 0;
                  return `
                    <tr class="hover:bg-slate-50">
                      <td class="py-3 px-3 font-bold text-slate-900">${b.dept}</td>
                      <td class="py-3 px-3 text-right font-extrabold text-brand-navy">${formatINR(b.monthlyCap)}</td>
                      <td class="py-3 px-3 text-right font-semibold text-amber-700">${formatINR(used)}</td>
                      <td class="py-3 px-3 text-right font-extrabold ${rem >= 0 ? 'text-emerald-700' : 'text-rose-600'}">${formatINR(rem)}</td>
                      <td class="py-3 px-3 text-center">
                        <span class="px-2 py-0.5 rounded-full text-[11px] font-bold ${pct >= 90 ? 'bg-rose-100 text-rose-800' : 'bg-emerald-100 text-emerald-800'}">${pct}%</span>
                      </td>
                      <td class="py-3 px-3 text-right">
                        <button onclick="document.getElementById('bdg-dept').value='${b.dept}'; document.getElementById('bdg-cap').value='${b.monthlyCap}'; document.getElementById('bdg-cap').focus();" class="px-3 py-1 rounded-lg border border-slate-300 hover:bg-slate-100 font-bold text-[11px]">Edit Cap</button>
                      </td>
                    </tr>
                  `;
                }).join('')}
              </tbody>
            </table>
          </div>
        </div>
      `;
    }

    function handleSaveDeptBudget(e) {
      e.preventDefault();
      const dept = document.getElementById('bdg-dept').value.trim();
      const cap = Number(document.getElementById('bdg-cap').value);
      const existing = state.deptBudgets.find(b => b.dept.toLowerCase() === dept.toLowerCase());
      if (existing) {
        existing.monthlyCap = cap;
        showToast(`Updated monthly budget for "${existing.dept}" to ${formatINR(cap)}!`, 'success');
      } else {
        state.deptBudgets.push({ dept, monthlyCap: cap });
        showToast(`Added department "${dept}" with monthly budget ${formatINR(cap)}!`, 'success');
      }
      renderDeptBudgetSettings(document.getElementById('workspace'));
    }

    // =========================================================================
    // 15. INITIALIZE APPLICATION ON WINDOW LOAD
    // =========================================================================
    window.addEventListener('DOMContentLoaded', () => {
      navigate('dashboard');
    });
  </script>
</body>
</html>
