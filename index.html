    function cleanProductName(raw) {
      return String(raw || '').replace(/^_+/, '').trim();

    function formatINR(num) {
      return '₹' + Number(num || 0).toLocaleString('en-IN', { maximumFractionDigits: 2 });
    }

    function getAsset(assetId) {
      return state.assets.find(a => a.id === assetId);
    }

    function getVendor(vendorId) {
      return state.vendors.find(v => v.id === vendorId);
    }

    function calcPOFinancials(po) {
      let subTotal = 0;
      let totalGst = 0;
      (po.items || []).forEach(it => {
        const base = (Number(it.qty) || 0) * (Number(it.unitPrice) || 0);
        const tax = base * ((Number(it.gst) || 0) / 100);
        subTotal += base;
        totalGst += tax;
      });
      return { subTotal, totalGst, grandTotal: subTotal + totalGst };
    }

    function getExpiringAssets30Days() {
      const now = new Date('2026-11-24');
      const limit = new Date(now.getTime() + 30 * 24 * 60 * 60 * 1000);
      return state.assets.filter(a => {
        const exp = a.expiry ? new Date(a.expiry) : null;
        const war = a.warranty ? new Date(a.warranty) : null;
        return (exp && exp <= limit) || (war && war <= limit);
      });
    }

    function showToast(message, type = 'success') {
      const container = document.getElementById('toast-container');
      const colors = {
        success: 'bg-emerald-600 text-white border-emerald-700',
        error: 'bg-rose-600 text-white border-rose-700',
        warning: 'bg-amber-500 text-slate-950 border-amber-600',
        info: 'bg-[#0f294a] text-white border-sky-700'
      };
      const icons = {
        success: 'check-circle-2',
        error: 'alert-octagon',
        warning: 'alert-triangle',
        info: 'info'
      };
      const toast = document.createElement('div');
      toast.className = `pointer-events-auto flex items-center gap-3 px-4 py-3 rounded-xl shadow-lg border text-xs font-semibold transform transition-all duration-300 translate-x-4 opacity-0 ${colors[type] || colors.info}`;
      toast.innerHTML = `
        <i data-lucide="${icons[type] || 'info'}" class="w-4 h-4 shrink-0"></i>
        <span class="flex-1 leading-snug">${message}</span>
      `;
      container.appendChild(toast);
      lucide.createIcons();
      requestAnimationFrame(() => {
        toast.classList.remove('translate-x-4', 'opacity-0');
      });
      setTimeout(() => {
        toast.classList.add('opacity-0', 'translate-x-4');
        setTimeout(() => toast.remove(), 300);
      }, 3800);
    }

    function exportTableCSV(filename, headers, rows) {
      const csvContent = [
        headers.join(','),
        ...rows.map(r => r.map(val => `"${String(val ?? '').replace(/"/g, '""')}"`).join(','))
      ].join('\n');
      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = filename;
      link.click();
      showToast(`Exported ${filename} successfully.`, 'success');
    }

    function exportSheetXLSX(filename, sheetName, headers, rows) {
      if (typeof XLSX === 'undefined') {
        exportTableCSV(filename.replace(/\.xlsx$/i, '.csv'), headers, rows);
        return;
      }
      const ws = XLSX.utils.aoa_to_sheet([headers, ...rows]);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, sheetName);
      XLSX.writeFile(wb, filename);
      showToast(`Downloaded ${filename} successfully.`, 'success');
    }

    function copyTableText(headers, rows) {
      const text = [headers.join('\t'), ...rows.map(r => r.join('\t'))].join('\n');
      const ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      showToast('Table rows copied to clipboard!', 'info');
    }

    function renderCategoryRows(list) {
      return list.map((c, idx) => `
        <tr class="${idx % 2 === 0 ? 'bg-white' : 'bg-slate-50/70'} hover:bg-sky-50/50">
          <td class="py-3 px-4 font-bold text-slate-800">${c.id}</td>
          <td class="py-3 px-4 font-medium text-slate-700">${c.name}</td>
          <td class="py-3 px-4 text-center">${c.depRate}%</td>

          <td class="py-3 px-4 text-center text-slate-500">${c.createdAt}</td>

            <button onclick="deleteCategory('${c.id}')" class="text-rose-500 hover:text-rose-700 p-1 rounded-lg hover:bg-rose-50 transition" title="Delete">
              <i data-lucide="trash-2" class="w-4 h-4 inline"></i>
            </button>
          </td>
        </tr>
      `).join('');
    }

    function handleAddCategory(e) {
      e.preventDefault();
      const id = document.getElementById('cat-id').value.trim();
      const name = document.getElementById('cat-name').value.trim();
      const depRate = parseFloat(document.getElementById('cat-dep').value) || 0;
      const depRateIT = parseFloat(document.getElementById('cat-dep-it').value) || 0;

      if (state.categories.some(c => c.id.toLowerCase() === id.toLowerCase())) {
        showToast('Category ID already exists!', 'error');
        return;
      }
      const today = new Date().toLocaleDateString('en-GB').replace(/\//g, '-');
      state.categories.unshift({ id, name, depRate, depRateIT, createdAt: today });
      saveState();
      showToast(`Category "${name}" added successfully!`, 'success');
      navigate('categories');
    }

    function filterCategoryTable() {
      const q = document.getElementById('cat-search').value.toLowerCase();
      const filtered = state.categories.filter(c => c.id.toLowerCase().includes(q) || c.name.toLowerCase().includes(q));
      document.getElementById('cat-tbody').innerHTML = renderCategoryRows(filtered);
      lucide.createIcons();
    }

    function deleteCategory(id) {
      state.categories = state.categories.filter(c => c.id !== id);
      saveState();
      showToast('Category removed.', 'info');
      navigate('categories');
    }

    function handleExcelFileUpload(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const data = new Uint8Array(e.target.result);
          const workbook = XLSX.read(data, { type: 'array' });
          const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
          const rawRows = XLSX.utils.sheet_to_json(firstSheet, { defval: '' });

          if (rawRows.length === 0) {
            showToast('Uploaded file is empty. Please use the sample template.', 'error');
            return;
          }

          const seenCodes = new Set(state.assets.map(a => a.code.toLowerCase()));
          pendingExcelRows = rawRows.map((r, idx) => {
            const rawCat = String(r['Category'] || r['Category ID / Name'] || '').trim();
            const matchedCat = state.categories.find(c =>
              c.id.toLowerCase() === rawCat.toLowerCase() || c.name.toLowerCase() === rawCat.toLowerCase()
            );

            const code = String(r['Asset Code'] || '').trim();
            const name = cleanProductName(r['Asset Name'] || '');
            const brand = String(r['Brand'] || r['Brand / Make'] || 'Generic').trim();
            const unit = String(r['Unit'] || 'Nos').trim();
            const qty = Number(r['Opening Stock Qty']);
            const rate = Number(r['Unit Rate'] ?? r['Unit Rate (₹)']);
            const minStock = Number(r['Minimum Stock'] || 2);
            const location = String(r['Location'] || 'Main Store').trim();
            const warrantyDate = String(r['Warranty/Expiry Date'] || '2028-05-31').trim();

            const errors = [];
            if (!matchedCat) errors.push(`Unknown Category "${rawCat}"`);
            if (!code) errors.push('Missing Asset Code');
            else if (seenCodes.has(code.toLowerCase())) errors.push(`Duplicate Asset Code "${code}"`);
            if (!name) errors.push('Missing Asset Name');
            if (isNaN(qty) || qty < 0 || r['Opening Stock Qty'] === '') errors.push('Invalid Opening Qty');
            if (isNaN(rate) || rate < 0 || (r['Unit Rate'] === '' && r['Unit Rate (₹)'] === undefined)) errors.push('Invalid Unit Rate');

            if (errors.length === 0 && code) {
              seenCodes.add(code.toLowerCase());
            }

            return {
              rowNum: idx + 2,
              categoryId: matchedCat ? matchedCat.id : rawCat,
              code,
              name,
              brand,
              unit,
              qty: isNaN(qty) ? 0 : qty,
              rate: isNaN(rate) ? 0 : rate,
              minStock: isNaN(minStock) ? 2 : minStock,
              location,
              warrantyDate,
              isValid: errors.length === 0,
              errors
            };
          });

          const container = document.getElementById('excel-preview-container');
          container.innerHTML = renderExcelPreviewHTML();
          container.classList.remove('hidden');
          lucide.createIcons();
          showToast(`Parsed ${pendingExcelRows.length} row(s) from ${file.name}. Review validation preview below.`, 'info');
        } catch (err) {
          console.error(err);
          showToast('Could not parse file. Please upload a valid .xlsx or .csv template.', 'error');
        }
      };
      reader.readAsArrayBuffer(file);
    }

                Confirm & Import ${validRows.length} Valid Row(s)
              </button>
            </div>
          </div>

          <div class="overflow-x-auto max-h-64 border border-slate-200 rounded-lg">
            <table class="w-full text-left text-xs">
              <thead class="bg-slate-100 text-slate-700 font-bold sticky top-0">
                <tr>
                  <th class="py-2 px-2.5">Excel Row</th>
                  <th class="py-2 px-2.5">Status</th>
                  <th class="py-2 px-2.5">Category</th>
                  <th class="py-2 px-2.5">Asset Code</th>

              </thead>
              <tbody class="divide-y divide-slate-200">
                ${pendingExcelRows.map(r => `
                  <tr class="${r.isValid ? 'bg-emerald-50/40' : 'bg-rose-50/80 text-rose-900'}">

                        : `<span class="inline-flex items-center gap-1 text-rose-700 font-bold" title="${r.errors.join(', ')}"><i data-lucide="x-circle" class="w-3.5 h-3.5"></i> ${r.errors.join('; ')}</span>`

    function clearExcelPreview() {

    function confirmExcelImport() {
      const validRows = pendingExcelRows.filter(r => r.isValid);
      if (validRows.length === 0) return;

      let totalOpeningVal = 0;
      validRows.forEach((r, i) => {
        totalOpeningVal += r.qty * r.rate;
        state.assets.unshift({
          id: 'AST-' + (200 + state.assets.length + i),
          categoryId: r.categoryId,
          code: r.code,
          name: cleanProductName(r.name),
          brand: r.brand || 'Generic',
          stock: r.qty,
          minStock: r.minStock,
          unitPrice: r.rate,
          unit: r.unit || 'Nos',
          location: r.location || 'Main Store',
          expiry: r.warrantyDate || '2028-05-31',
          warranty: r.warrantyDate || '2028-05-31'
        });

        // Auto-add location if not in directory
        if (r.location && !state.locations.some(l => l.name.toLowerCase() === r.location.toLowerCase())) {
          state.locations.push({
            id: 'LOC-0' + (state.locations.length + 1),
            name: r.location,
            building: 'Imported via Excel',
            incharge: 'Store Manager',
            capacity: '250 Items'
          });
        }
      });

      // Push Opening Stock Asset Ledger entry to Financial Accounting Sync Log
      state.accountingSyncLog.unshift({
        voucherId: 'OB-2026-00' + (state.accountingSyncLog.length + 1),
        date: '2026-11-24',
        type: 'Opening Stock Excel Import',
        ref: `${validRows.length} SKUs Imported`,
        ledger: 'Inventory Opening Stock Asset A/c',
        amount: Math.round(totalOpeningVal),
        status: 'Synced to Financial Accounting'
      });

      pendingExcelRows = [];
      saveState();
      showToast(`Imported ${validRows.length} opening stock items (${formatINR(totalOpeningVal)}) & synced to Financial Accounting!`, 'success');
      navigate('assets');
    }

    function handleAddAsset(e) {
      e.preventDefault();
      const code = document.getElementById('ast-code').value.trim();
      if (state.assets.some(a => a.code.toLowerCase() === code.toLowerCase())) {
        showToast(`Asset Code "${code}" already exists!`, 'error');
        return;
      }
      const stock = parseInt(document.getElementById('ast-stock').value, 10) || 0;
      const unitPrice = parseFloat(document.getElementById('ast-price').value) || 0;
      const warrantyDate = document.getElementById('ast-warranty').value || '2028-05-31';

      const newAsset = {
        id: 'AST-' + (200 + state.assets.length + 1),
        categoryId: document.getElementById('ast-cat').value,
        code,
        name: cleanProductName(document.getElementById('ast-name').value),
        brand: document.getElementById('ast-brand').value.trim() || 'Generic',
        unit: document.getElementById('ast-unit').value,
        stock,
        minStock: parseInt(document.getElementById('ast-min').value, 10) || 0,
        unitPrice,
        location: document.getElementById('ast-loc').value,
        warranty: warrantyDate,
        expiry: warrantyDate
      };
      state.assets.unshift(newAsset);

      if (stock > 0 && unitPrice > 0) {
        state.accountingSyncLog.unshift({
          voucherId: 'OB-2026-00' + (state.accountingSyncLog.length + 1),
          date: '2026-11-24',
          type: 'Opening Stock Asset Entry',
          ref: `${newAsset.code} (${stock} ${newAsset.unit})`,
          ledger: 'Inventory Opening Stock Asset A/c',
          amount: Math.round(stock * unitPrice),
          status: 'Synced to Financial Accounting'
        });
      }

      saveState();
      showToast(`Asset "${newAsset.name}" added with ${stock} opening stock!`, 'success');
      navigate('assets');
    }

    function updateReqEstCost() {
      const sel = document.getElementById('req-asset');
      const opt = sel.options[sel.selectedIndex];
      const price = opt ? parseFloat(opt.dataset.price || 0) : 0;
      const qty = parseInt(document.getElementById('req-qty').value, 10) || 0;
      document.getElementById('req-cost').value = price * qty;
    }

    function handleCreateRequisition(e) {
      e.preventDefault();
      const assetId = document.getElementById('req-asset').value;
      const asset = getAsset(assetId);
      const qty = parseInt(document.getElementById('req-qty').value, 10);
      const requesterName = document.getElementById('req-name').value.trim();
      const dept = document.getElementById('req-dept').value;
      const newId = 'REQ-0000' + (15 + state.requisitions.length);
      const today = new Date().toISOString().slice(0, 10);

      state.requisitions.unshift({
        id: newId,
        date: today,
        department: dept,
        requesterName,
        requesterRole: document.getElementById('req-role').value.trim(),
        contact: document.getElementById('req-contact').value.trim(),
        categoryId: asset ? asset.categoryId : 'General',
        assetId,
        qty,
        issuedQty: 0,
        estCost: parseFloat(document.getElementById('req-cost').value) || 0,
        priority: document.getElementById('req-priority').value,
        level1: 'Pending',
        level2: 'Pending',
        level3: 'Pending',
        status: 'Pending Approval',
        remarks: document.getElementById('req-remarks').value.trim(),
        history: [
          { time: new Date().toLocaleString('en-IN'), action: `Requisition Raised for ${qty}x ${asset ? asset.name : assetId} by ${requesterName} (${dept})`, by: requesterName }
        ]
      });
      saveState();
      showToast(`Requisition ${newId} submitted for approval!`, 'success');
      navigate('requisition-list');
    }

    function renderRequisitionRows(list) {
      if (list.length === 0) {
        return `<tr><td colspan="8" class="py-8 text-center text-slate-400">No requisitions match the current filter/role.</td></tr>`;
      }
      return list.map(r => {
        const asset = getAsset(r.assetId);
        const remaining = r.qty - r.issuedQty;
        const canIssue = (r.status === 'Approved' || r.status === 'PO Created' || r.status === 'Partially Issued') && remaining > 0;
        const isSuperAdmin = state.activeRole === 'Super Admin';

        let statusBadge = '';
        if (r.status === 'Completed (Item Issued)') {
          statusBadge = `<span class="inline-flex items-center gap-1 px-2.5 py-1 rounded-full font-bold bg-emerald-100 text-emerald-800 border border-emerald-200"><i data-lucide="check-circle-2" class="w-3.5 h-3.5"></i> Completed (Item Issued)</span>`;
        } else if (r.status === 'Partially Issued') {
          statusBadge = `<span class="inline-flex items-center gap-1 px-2.5 py-1 rounded-full font-bold bg-teal-100 text-teal-800">Partially Issued (${r.issuedQty}/${r.qty})</span>`;
        } else if (r.status === 'PO Created') {
          statusBadge = `<span class="inline-flex items-center px-2.5 py-1 rounded-full font-bold bg-sky-100 text-sky-800">PO Created</span>`;
        } else if (r.status === 'Approved') {
          statusBadge = `<span class="inline-flex items-center px-2.5 py-1 rounded-full font-bold bg-indigo-100 text-indigo-800">Approved</span>`;
        } else if (r.status === 'Pending Approval') {
          statusBadge = `<span class="inline-flex items-center px-2.5 py-1 rounded-full font-bold bg-amber-100 text-amber-800">Pending Level 1 Approval</span>`;
        } else {
          statusBadge = `<span class="inline-flex items-center px-2.5 py-1 rounded-full font-bold bg-rose-100 text-rose-700">${r.status}</span>`;
        }

        return `
          <tr class="hover:bg-slate-50/90 align-top">
            <td class="py-3.5 px-3 font-bold text-brand-blue whitespace-nowrap">${r.id}</td>
            <td class="py-3.5 px-3 whitespace-nowrap">
              <div class="font-semibold text-slate-800">${r.date}</div>
              <div class="text-[11px] text-slate-500">${r.department}</div>
            </td>
            <td class="py-3.5 px-3">
              <div class="font-bold text-slate-800">${r.requesterName}</div>
              <div class="text-[11px] text-slate-500">${r.requesterRole}</div>
            </td>
            <td class="py-3.5 px-3">
              <div class="font-semibold text-slate-800">${asset ? asset.name : r.assetId}</div>
              <div class="text-[11px] text-slate-500">Req: <strong>${r.qty}</strong> • Issued: <strong>${r.issuedQty}</strong> • Est: ${formatINR(r.estCost)}</div>
            </td>
            <td class="py-3.5 px-3">
              <span class="font-bold ${r.priority === 'Urgent' ? 'text-orange-600' : 'text-slate-600'}">${r.priority}</span>
            </td>
            <td class="py-3.5 px-3 text-[11px] leading-relaxed whitespace-nowrap">
              <div>Level 1: <strong class="${r.level1 === 'Approved' ? 'text-emerald-600' : 'text-amber-600'}">${r.level1}</strong></div>
              <div>Level 2 (Principal Sir): <strong class="text-slate-600">${r.level2}</strong></div>
              <div>Level 3 (Ashish Sir): <strong class="${r.level3 === 'Approved' ? 'text-emerald-600' : 'text-amber-600'}">${r.level3}</strong></div>
            </td>
            <td class="py-3.5 px-3">${statusBadge}</td>
            <td class="py-3.5 px-3 text-right space-y-1.5 whitespace-nowrap">
              <div>
                <button onclick="openReqHistoryModal('${r.id}')" class="px-2.5 py-1 rounded-lg border border-slate-300 bg-white hover:bg-slate-100 text-slate-700 font-semibold text-[11px] transition">
                  Details & history
                </button>
              </div>
              ${canIssue && isSuperAdmin ? `
                <div>
                  <button onclick="navigate('issue', { reqId: '${r.id}' })" class="bg-emerald-600 hover:bg-emerald-700 text-white font-semibold px-3 py-1.5 rounded-lg text-[11px] shadow-xs transition">
                    Issue ${asset ? asset.name.split('(')[0].trim() : 'Item'} (${asset ? asset.stock : 0} in stock)
                  </button>
                </div>
              ` : ''}
              ${r.status === 'Pending Approval' && isSuperAdmin ? `
                <div class="flex justify-end gap-1">
                  <button onclick="approveRequisition('${r.id}')" class="bg-brand-blue hover:bg-sky-700 text-white font-semibold px-2.5 py-1 rounded-lg text-[11px]">Approve</button>
                  <button onclick="cancelRequisition('${r.id}')" class="bg-rose-50 hover:bg-rose-100 text-rose-600 border border-rose-200 font-semibold px-2.5 py-1 rounded-lg text-[11px]">Cancel</button>
                </div>
              ` : ''}
            </td>
          </tr>
        `;
      }).join('');
    }

    function filterRequisitionList() {
      const status = document.getElementById('req-status-filter').value;
      let list = state.requisitions;
      if (state.activeRole.includes('Trapti')) list = list.filter(r => r.requesterName.includes('Trapti'));
      if (state.activeRole.includes('Chandraprabha')) list = list.filter(r => r.requesterName.includes('Chandraprabha'));
      if (status !== 'ALL') list = list.filter(r => r.status === status);
      document.getElementById('req-list-tbody').innerHTML = renderRequisitionRows(list);
      lucide.createIcons();
    }

    function approveRequisition(reqId) {
      const req = state.requisitions.find(r => r.id === reqId);
      if (!req) return;
      req.level1 = 'Approved';
      req.level2 = 'Approved';
      req.level3 = 'Approved';
      req.status = 'Approved';
      req.history.push({
        time: new Date().toLocaleString('en-IN'),
        action: 'All Approval Levels (L1, Principal Sir, Ashish Sir) Approved',
        by: state.activeRole
      });
      saveState();
      showToast(`${reqId} approved and ready for PO / Issue!`, 'success');
      navigate('requisition-list');
    }

    function cancelRequisition(reqId) {
      const req = state.requisitions.find(r => r.id === reqId);
      if (!req) return;
      req.status = 'Cancelled';
      req.history.push({ time: new Date().toLocaleString('en-IN'), action: 'Requisition Cancelled', by: state.activeRole });
      saveState();
      showToast(`${reqId} marked as Cancelled.`, 'warning');
      navigate('requisition-list');
    }

          <div><span class="text-slate-400 block">Current Status</span><strong class="text-emerald-700">${req.status}</strong></div>
          <div><span class="text-slate-400 block">Requested Qty</span><strong>${req.qty}</strong></div>
          <div><span class="text-slate-400 block">Issued Qty</span><strong>${req.issuedQty}</strong></div>
          <div><span class="text-slate-400 block">Linked PO</span><strong>${req.linkedPO || 'Direct Stock'}</strong></div>
        </div>
        <h4 class="font-bold text-xs uppercase tracking-wider text-slate-500 mb-2.5">Complete Event Log</h4>

              <div class="text-[11px] text-slate-400">${h.time} • By ${h.by}</div>
            </div>
          `).join('')}
        </div>
      `);

    function renderPODraftRowsHTML() {
      return poDraftRows.map((row, idx) => {
        const lineBase = (Number(row.qty) || 0) * (Number(row.unitPrice) || 0);
        const lineTotal = lineBase * (1 + (Number(row.gst) || 0) / 100);
        return `
          <tr>
            <td class="py-2.5 px-2.5 font-bold text-slate-600">${idx + 1}</td>
            <td class="py-2.5 px-2.5">
              <select onchange="updatePODraftField(${idx}, 'categoryId', this.value)" class="w-full rounded-lg border border-slate-300 px-2 py-1.5 text-xs bg-white">
                ${state.categories.map(c => `<option value="${c.id}" ${row.categoryId === c.id ? 'selected' : ''}>${c.id}</option>`).join('')}
              </select>
            </td>
            <td class="py-2.5 px-2.5">
              <select onchange="handlePODraftAssetChange(${idx}, this.value)" class="w-full rounded-lg border border-slate-300 px-2 py-1.5 text-xs font-semibold bg-white">
                ${state.assets.map(a => `<option value="${a.id}" ${row.assetId === a.id ? 'selected' : ''}>${a.name}</option>`).join('')}
              </select>
            </td>
            <td class="py-2.5 px-2.5">
              <input type="text" value="${row.variant}" oninput="updatePODraftField(${idx}, 'variant', this.value)" placeholder="Variant" class="w-full rounded-lg border border-slate-300 px-2 py-1.5 text-xs" />
            </td>
            <td class="py-2.5 px-2.5">
              <select onchange="updatePODraftField(${idx}, 'unit', this.value)" class="w-full rounded-lg border border-slate-300 px-2 py-1.5 text-xs bg-white">
                ${['Nos', 'Pcs', 'Ream', 'Unit', 'Set', 'Can', 'Box'].map(u => `<option value="${u}" ${row.unit === u ? 'selected' : ''}>${u}</option>`).join('')}
              </select>
            </td>
            <td class="py-2.5 px-2.5">
              <input type="text" value="${row.color}" oninput="updatePODraftField(${idx}, 'color', this.value)" placeholder="Color" class="w-full rounded-lg border border-slate-300 px-2 py-1.5 text-xs" />
            </td>
            <td class="py-2.5 px-2.5">
              <input type="number" min="1" value="${row.qty}" oninput="updatePODraftField(${idx}, 'qty', this.value)" class="w-full rounded-lg border border-slate-300 px-2 py-1.5 text-xs font-bold" />
            </td>
            <td class="py-2.5 px-2.5">
              <input type="number" min="0" value="${row.unitPrice}" oninput="updatePODraftField(${idx}, 'unitPrice', this.value)" class="w-full rounded-lg border border-slate-300 px-2 py-1.5 text-xs font-bold" />
            </td>
            <td class="py-2.5 px-2.5">
              <select onchange="updatePODraftField(${idx}, 'gst', this.value)" class="w-full rounded-lg border border-slate-300 px-2 py-1.5 text-xs bg-white">
                ${[0, 5, 12, 18, 28].map(g => `<option value="${g}" ${Number(row.gst) === g ? 'selected' : ''}>${g}%</option>`).join('')}
              </select>
            </td>
            <td class="py-2.5 px-2.5 text-right font-extrabold text-slate-900" id="po-line-total-${idx}">
              ${formatINR(lineTotal)}
            </td>
            <td class="py-2.5 px-2.5 text-center">
              ${poDraftRows.length > 1 ? `
                <button type="button" onclick="removePODraftRow(${idx})" class="text-rose-500 hover:text-rose-700 p-1 rounded-lg hover:bg-rose-50" title="Remove row">
                  <i data-lucide="trash-2" class="w-4 h-4 inline"></i>
                </button>
              ` : `<span class="text-slate-300">—</span>`}
            </td>
          </tr>
        `;
      }).join('');
    }

    function addPODraftRow() {
      const def = state.assets[0];
      poDraftRows.push({
        categoryId: def.categoryId,
        assetId: def.id,
        variant: 'Standard',
        unit: def.unit || 'Nos',
        color: '',
        qty: 1,
        unitPrice: def.unitPrice,
        gst: 18
      });
      document.getElementById('po-items-tbody').innerHTML = renderPODraftRowsHTML();
      recalcPODraftTotals();
      lucide.createIcons();
    }

    function removePODraftRow(idx) {
      poDraftRows.splice(idx, 1);
      document.getElementById('po-items-tbody').innerHTML = renderPODraftRowsHTML();
      recalcPODraftTotals();
      lucide.createIcons();
    }

    function handlePODraftAssetChange(idx, assetId) {
      const asset = getAsset(assetId);
      if (asset) {
        poDraftRows[idx].assetId = asset.id;
        poDraftRows[idx].categoryId = asset.categoryId;
        poDraftRows[idx].unit = asset.unit || 'Nos';
        poDraftRows[idx].unitPrice = asset.unitPrice;
      }
      document.getElementById('po-items-tbody').innerHTML = renderPODraftRowsHTML();
      recalcPODraftTotals();
      lucide.createIcons();
    }

    function updatePODraftField(idx, field, val) {
      poDraftRows[idx][field] = (field === 'qty' || field === 'unitPrice' || field === 'gst') ? parseFloat(val) || 0 : val;
      const lineBase = poDraftRows[idx].qty * poDraftRows[idx].unitPrice;
      const lineTotal = lineBase * (1 + poDraftRows[idx].gst / 100);
      const cell = document.getElementById(`po-line-total-${idx}`);
      if (cell) cell.textContent = formatINR(lineTotal);
      recalcPODraftTotals();
    }

    function recalcPODraftTotals() {
      const fin = calcPOFinancials({ items: poDraftRows });
      const subEl = document.getElementById('po-summary-sub');
      const gstEl = document.getElementById('po-summary-gst');
      const grandEl = document.getElementById('po-summary-grand');
      if (subEl) subEl.textContent = formatINR(fin.subTotal);
      if (gstEl) gstEl.textContent = formatINR(fin.totalGst);
      if (grandEl) grandEl.textContent = formatINR(fin.grandTotal);
    }

    function openPullRequisitionsModal() {
      const candidates = state.requisitions.filter(r => r.status !== 'Cancelled' && r.status !== 'Completed (Item Issued)');
      openModal(`
        <div class="flex items-start justify-between border-b border-slate-200 pb-3 mb-4">
          <div>
            <span class="text-xs font-bold uppercase tracking-wider text-brand-blue">Requisition Consolidation</span>
            <h3 class="font-display font-extrabold text-lg text-slate-900">Pull Approved Requisitions into PO</h3>
          </div>
          <button onclick="closeModal()" class="p-1.5 rounded-lg hover:bg-slate-100 text-slate-500"><i data-lucide="x" class="w-5 h-5"></i></button>
        </div>
        <div class="space-y-2 max-h-72 overflow-y-auto mb-4">
          ${candidates.map(r => {
            const a = getAsset(r.assetId);
            return `
              <label class="flex items-center justify-between p-3 rounded-xl border border-slate-200 hover:bg-sky-50/50 cursor-pointer">
                <div class="flex items-center gap-3">
                  <input type="checkbox" class="pull-req-chk w-4 h-4 rounded text-brand-blue" value="${r.id}" checked />
                  <div>
                    <div class="text-xs font-bold text-slate-800">${r.id} — ${a ? a.name : r.assetId} (Qty: ${r.qty})</div>
                    <div class="text-[11px] text-slate-500">Requested by ${r.requesterName} (${r.department})</div>
                  </div>
                </div>
                <span class="text-xs font-bold text-brand-navy">${formatINR(r.estCost)}</span>
              </label>
            `;
          }).join('')}
        </div>
        <div class="flex justify-end gap-2">
          <button onclick="closeModal()" class="px-4 py-2 rounded-xl bg-slate-100 text-xs font-semibold text-slate-700">Cancel</button>
          <button onclick="applyPulledRequisitions()" class="px-5 py-2 rounded-xl bg-[#0f294a] hover:bg-brand-blue text-white text-xs font-bold">Import Selected Items to PO</button>
        </div>
      `);
    }

    function applyPulledRequisitions() {
      const checked = Array.from(document.querySelectorAll('.pull-req-chk:checked')).map(el => el.value);
      if (checked.length === 0) {
        closeModal();
        return;
      }
      poDraftRows = checked.map(reqId => {
        const req = state.requisitions.find(r => r.id === reqId);
        const asset = getAsset(req.assetId);
        return {
          categoryId: asset ? asset.categoryId : req.categoryId,
          assetId: req.assetId,
          variant: 'Standard',
          unit: asset ? asset.unit : 'Nos',
          color: '',
          qty: req.qty,
          unitPrice: asset ? asset.unitPrice : 1000,
          gst: 18,
          reqId: req.id
        };
      });
      closeModal();
      document.getElementById('po-items-tbody').innerHTML = renderPODraftRowsHTML();
      recalcPODraftTotals();
      lucide.createIcons();
      showToast(`Imported ${poDraftRows.length} requisition item(s) into PO #${getNextPONumber()}!`, 'success');
    }

    function renderPOEntriesRows(list) {
      return list.map(po => {
        const vendor = getVendor(po.vendorId);
        const fin = calcPOFinancials(po);
        const isDelivered = po.status === 'Delivered (GRN completed)';
        const isApproved = po.status === 'Approved (Ready for GRN)';
        const isCancelled = po.status === 'Cancelled';
        const isSuperAdmin = state.activeRole === 'Super Admin';

        let statusClass = 'text-amber-700 bg-amber-50 border-amber-200';
        if (isDelivered) statusClass = 'text-emerald-800 bg-emerald-50 border-emerald-200';
        else if (isApproved) statusClass = 'text-sky-800 bg-sky-50 border-sky-200';
        else if (po.status.includes('Quotation Uploaded')) statusClass = 'text-indigo-800 bg-indigo-50 border-indigo-200';
        else if (isCancelled) statusClass = 'text-rose-700 bg-rose-50 border-rose-200';

        return `
          <tr class="hover:bg-slate-50 align-middle">
            <td class="py-3 px-3 font-bold text-slate-800">${po.id}</td>
            <td class="py-3 px-3 font-medium text-slate-700">${vendor ? vendor.name : po.vendorId}</td>
            <td class="py-3 px-3 whitespace-nowrap">${po.date}</td>
            <td class="py-3 px-3 whitespace-nowrap">${po.expectedDelivery}</td>
            <td class="py-3 px-3 text-right font-extrabold text-brand-navy whitespace-nowrap">${formatINR(fin.grandTotal)}</td>
            <td class="py-3 px-3 text-center">
              <div class="inline-flex flex-wrap items-center justify-center gap-1.5">
                ${!isDelivered && !isApproved && !isCancelled ? `
                  <button onclick="openQuotationModal('${po.id}')" class="bg-[#0f294a] hover:bg-brand-blue text-white font-semibold px-2.5 py-1 rounded-lg text-[11px] transition">
                    + Add Quotation (${(po.quotations || []).length}/3)
                  </button>
                ` : ''}
                <button onclick="openViewPOModal('${po.id}')" class="border border-sky-300 bg-white hover:bg-sky-50 text-brand-blue font-semibold px-2.5 py-1 rounded-lg text-[11px] transition">
                  View PO
                </button>
                ${!isDelivered && !isApproved && !isCancelled && isSuperAdmin ? `
                  <button onclick="jointApprovePO('${po.id}')" class="bg-emerald-600 hover:bg-emerald-700 text-white font-semibold px-2.5 py-1 rounded-lg text-[11px] transition">
                    Joint Approve (Principal/Director)
                  </button>
                ` : ''}
                ${isApproved ? `
                  <button onclick="navigate('grn', { poId: '${po.id}' })" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-3 py-1 rounded-lg text-[11px] shadow-xs transition">
                    Proceed to GRN
                  </button>
                ` : ''}
                ${!isDelivered && !isApproved && !isCancelled ? `
                  <button onclick="cancelPO('${po.id}')" class="border border-rose-300 bg-white hover:bg-rose-50 text-rose-600 font-semibold px-2.5 py-1 rounded-lg text-[11px] transition">
                    Cancel PO
                  </button>
                ` : ''}
              </div>
            </td>
            <td class="py-3 px-3">
              <span class="inline-block px-2.5 py-1 rounded-full border text-[11px] font-bold ${statusClass}">${po.status}</span>
            </td>
          </tr>
        `;
      }).join('');
    }

    function filterPOEntries() {
      const q = document.getElementById('po-list-search').value.toLowerCase();
      const filtered = state.purchaseOrders.filter(po => {
        const v = getVendor(po.vendorId);
        return po.id.toLowerCase().includes(q) || (v && v.name.toLowerCase().includes(q)) || po.status.toLowerCase().includes(q);
      });
      document.getElementById('po-entries-tbody').innerHTML = renderPOEntriesRows(filtered);
    }

    function exportPOListXLSX() {
      exportSheetXLSX(
        'SchoolMitra_PO_Register.xlsx',
        'PurchaseOrders',
        ['PO No', 'Vendor', 'PO Date', 'Expected Delivery', 'SubTotal', 'GST', 'Grand Total', 'Status'],
        state.purchaseOrders.map(po => {
          const fin = calcPOFinancials(po);
          return [po.id, getVendor(po.vendorId)?.name || po.vendorId, po.date, po.expectedDelivery, fin.subTotal, fin.totalGst, fin.grandTotal, po.status];
        })
      );
    }

    function handleCreatePO(e) {
      e.preventDefault();
      if (poDraftRows.length === 0) {
        showToast('Please add at least one item row to the PO.', 'error');
        return;
      }
      const newId = String(getNextPONumber());
      const linkedReqs = poDraftRows.map(r => r.reqId).filter(Boolean);

      state.purchaseOrders.unshift({
        id: newId,
        date: document.getElementById('po-date').value,
        expectedDelivery: document.getElementById('po-delivery').value,
        createdAt: new Date().toLocaleDateString('en-GB').replace(/\//g, '-'),
        vendorId: document.getElementById('po-vendor').value,
        linkedReqs,
        notes: document.getElementById('po-notes').value.trim(),
        terms: document.getElementById('po-terms').value.trim(),
        status: 'Pending approval (Principal or Director)',
        quotations: [],
        items: JSON.parse(JSON.stringify(poDraftRows))
      });

      linkedReqs.forEach(reqId => {
        const req = state.requisitions.find(r => r.id === reqId);
        if (req) {
          req.status = 'PO Created';
          req.linkedPO = newId;
          req.history.push({ time: new Date().toLocaleString('en-IN'), action: `Consolidated into Multi-Item PO #${newId}`, by: state.activeRole });
        }
      });

      poDraftRows = [];
      saveState();
      showToast(`PO #${newId} created! Upload comparative quotations or submit for Joint Approval.`, 'success');
      navigate('create-po');
    }

        ${qList.length < 3 ? `

            <div>
              <label class="block text-[11px] font-bold text-slate-700 mb-1">Vendor Name</label>

    function handleSubmitGRN(e) {
      e.preventDefault();
      const poId = document.getElementById('grn-po-select').value;
      const grnDate = document.getElementById('grn-date').value;
      const rows = Array.from(document.querySelectorAll('.grn-line-row'));

      let totalPayable = 0;
      rows.forEach(row => {
        const assetId = row.dataset.asset;
        const catId = row.dataset.cat;
        const gst = parseFloat(row.dataset.gst) || 0;
        const qty = parseInt(row.querySelector('.grn-row-qty').value, 10) || 0;
        const unitPrice = parseFloat(row.querySelector('.grn-row-price').value) || 0;
        const expiry = row.querySelector('.grn-row-exp').value;
        const warranty = row.querySelector('.grn-row-war').value;

        const asset = getAsset(assetId);
        if (asset) {
          asset.stock += qty;
          if (unitPrice > 0) asset.unitPrice = unitPrice;
          if (expiry) asset.expiry = expiry;
          if (warranty) asset.warranty = warranty;
        }

        totalPayable += qty * unitPrice * (1 + gst / 100);

        state.grnRecords.unshift({
          id: 'GRN-2026-0' + (17 + state.grnRecords.length),
          poId: poId || 'MANUAL',
          date: grnDate,
          categoryId: catId,
          assetId,
          qty,
          unitPrice,
          bookValue: qty * unitPrice,
          expiry,
          warranty
        });
      });

      let vendorName = 'Direct Vendor';
      if (poId) {
        const po = state.purchaseOrders.find(p => p.id === poId);
        if (po) {
          po.status = 'Delivered (GRN completed)';
          vendorName = getVendor(po.vendorId)?.name || po.vendorId;
        }
      }

      state.accountingSyncLog.unshift({
        voucherId: 'AP-2026-0' + (89 + state.accountingSyncLog.length),
        date: grnDate,
        type: 'Vendor Payable Voucher',
        ref: poId ? `PO #${poId}` : 'Manual GRN',
        ledger: vendorName,
        amount: Math.round(totalPayable),
        status: 'Posted to Financial Accounting'
      });

      saveState();
      showToast(`GRN Completed! Stock updated & Payable (${formatINR(totalPayable)}) synced to Financial Accounting.`, 'success');
      navigate('po-reports');
    }

      const reqId = document.getElementById('iss-req-select').value;
      const assetId = document.getElementById('iss-asset').value;
      const qty = parseInt(document.getElementById('iss-qty').value, 10);
      const userName = document.getElementById('iss-username').value.trim();
      const role = document.getElementById('iss-role').value.trim();
      const contact = document.getElementById('iss-contact').value.trim();
      const issueDate = document.getElementById('iss-date').value;
      const location = document.getElementById('iss-location').value;

      const asset = getAsset(assetId);
      if (!asset) return;

      if (qty > asset.stock) {
        showToast(`Insufficient stock! Only ${asset.stock} available.`, 'error');
        return;
      }

      let department = 'General';
      if (reqId) {
        const req = state.requisitions.find(r => r.id === reqId);
        if (!req) return;

        if (req.requesterName !== userName) {
          showToast('Security violation: Issue blocked. Recipient must match original requester!', 'error');
          return;
        }

        const rem = req.qty - req.issuedQty;
        if (qty > rem) {
          showToast(`Cannot issue ${qty}. Remaining requisition balance is ${rem}.`, 'error');
          return;
        }

        req.issuedQty += qty;
        department = req.department;
        const slipNo = 'ISS-00' + (42 + state.issueLogs.length);

        if (req.issuedQty >= req.qty) {
          req.status = 'Completed (Item Issued)';
        } else {
          req.status = 'Partially Issued';
        }

        req.history.push({
          time: new Date().toLocaleString('en-IN'),
          action: `${qty} unit(s) Issued to ${userName} (${slipNo}) — Status: ${req.status}`,
          by: state.activeRole
        });
      }

      asset.stock -= qty;

      state.issueLogs.unshift({
        id: 'ISS-00' + (42 + state.issueLogs.length),
        date: issueDate,
        reqId: reqId || 'DIRECT',
        categoryId: asset.categoryId,
        assetId,
        location,
        qty,
        unitPrice: asset.unitPrice,
        role,
        userName,
        contact,
        department,
        mode: reqId ? 'Requisition-Locked' : 'Direct Ad-hoc'
      });

      saveState();
      showToast(`Issued ${qty} × ${asset.name} to ${userName}. Requisition updated to Completed (Item Issued)!`, 'success');
      navigate('requisition-list');
    }

      const start = document.getElementById('por-start')?.value || '2000-01-01';

      const status = document.getElementById('por-status')?.value || 'ALL';

      return state.purchaseOrders.filter(po => {
        if (po.date < start || po.date > end) return false;

        if (status === 'Pending' && !po.status.includes('Pending approval')) return false;

        const fin = calcPOFinancials(po);
        const items = (po.items || []).map(it => `${getAsset(it.assetId)?.name || it.assetId} x${it.qty}`).join('; ');
        return [
          po.id,
          po.date,
          getVendor(po.vendorId)?.name || po.vendorId,
          (po.linkedReqs || []).join(', ') || 'Direct PO',
          items,
          fin.subTotal,
          fin.totalGst,
          fin.grandTotal,
          `${(po.quotations || []).length} Quote(s)`,
          po.status
        ];

      if (fmt === 'xlsx') {
        exportSheetXLSX('SchoolMitra_PO_Report.xlsx', 'POReport', headers, rows);
      } else {
        exportTableCSV('SchoolMitra_PO_Report.csv', headers, rows);

    function handleStockAdjustment(e, mode) {
      e.preventDefault();
      const assetId = document.getElementById('adj-asset').value;
      const qty = parseInt(document.getElementById('adj-qty').value, 10) || 0;
      const date = document.getElementById('adj-date').value;
      const reason = document.getElementById('adj-reason').value.trim();
      const asset = getAsset(assetId);
      if (!asset) return;

      const isReturn = mode === 'Return to Store';
      if (!isReturn && qty > asset.stock) {
        showToast(`Cannot write off ${qty} units; only ${asset.stock} in usable stock.`, 'error');
        return;
      }

      if (isReturn) {
        asset.stock += qty;
      } else {
        asset.stock -= qty;
      }

      state.stockAdjustments.unshift({
        id: 'ADJ-00' + (state.stockAdjustments.length + 1),
        date,
        type: mode,
        assetId,
        qty,
        personOrReason: reason,
        value: qty * asset.unitPrice
      });

      saveState();
      closeModal();
      showToast(`${mode} recorded (${isReturn ? '+' : '-'}${qty} ${asset.name})!`, isReturn ? 'success' : 'warning');
      navigate('asset-management');
    }

              3. Stock Valuation & Depreciation
            </button>
            <button onclick="renderReports(document.getElementById('app-workspace'), 'lowstock')" class="px-4 py-2 rounded-xl text-xs font-bold transition ${tab === 'lowstock' ? 'bg-[#0f294a] text-white shadow-xs' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}">
              4. Low-Stock Reorder Report
            </button>
          </div>

          <div id="report-table-container">
            ${getReportTableHTML(tab)}
          </div>
        </div>
      `;
      lucide.createIcons();
    }

    function getReportTableHTML(tab) {
      if (tab === 'audit') {
        return `
          <div class="overflow-x-auto">
            <table class="w-full text-left text-xs">
              <thead class="bg-slate-100 text-slate-700 font-bold border-y border-slate-200">
                <tr>
                  <th class="py-3 px-3">Req ID</th>
                  <th class="py-3 px-3">Original Requester</th>
                  <th class="py-3 px-3">Department</th>
                  <th class="py-3 px-3">Item</th>
                  <th class="py-3 px-3 text-center">Req Qty</th>
                  <th class="py-3 px-3 text-center">Issued Qty</th>
                  <th class="py-3 px-3">Linked PO</th>
                  <th class="py-3 px-3">Final Lifecycle Status</th>
                </tr>
              </thead>
              <tbody class="divide-y divide-slate-200">
                ${state.requisitions.map(r => {
                  const a = getAsset(r.assetId);
                  return `
                    <tr>
                      <td class="py-3 px-3 font-bold text-brand-blue">${r.id}</td>
                      <td class="py-3 px-3 font-bold">${r.requesterName}</td>
                      <td class="py-3 px-3">${r.department}</td>
                      <td class="py-3 px-3">${a ? a.name : r.assetId}</td>
                      <td class="py-3 px-3 text-center">${r.qty}</td>
                      <td class="py-3 px-3 text-center font-bold">${r.issuedQty}</td>
                      <td class="py-3 px-3 font-mono">${r.linkedPO || '-'}</td>
                      <td class="py-3 px-3 font-bold ${r.status === 'Completed (Item Issued)' ? 'text-emerald-700' : 'text-amber-700'}">${r.status}</td>
                    </tr>
                  `;
                }).join('')}
              </tbody>
            </table>
          </div>
        `;
      }

      if (tab === 'consumption') {
        return `
          <div class="overflow-x-auto">
            <table class="w-full text-left text-xs">
              <thead class="bg-slate-100 text-slate-700 font-bold border-y border-slate-200">
                <tr>
                  <th class="py-3 px-3">Issue Slip</th>
                  <th class="py-3 px-3">Date</th>
                  <th class="py-3 px-3">Ref Requisition</th>
                  <th class="py-3 px-3">Issued To (Verified)</th>
                  <th class="py-3 px-3">Department</th>
                  <th class="py-3 px-3">Asset</th>
                  <th class="py-3 px-3 text-center">Qty</th>
                  <th class="py-3 px-3 text-right">Total Cost</th>
                </tr>
              </thead>
              <tbody class="divide-y divide-slate-200">
                ${state.issueLogs.map(log => {
                  const a = getAsset(log.assetId);
                  return `
                    <tr>
                      <td class="py-3 px-3 font-bold text-brand-blue">${log.id}</td>
                      <td class="py-3 px-3">${log.date}</td>
                      <td class="py-3 px-3 font-mono">${log.reqId}</td>
                      <td class="py-3 px-3 font-bold">${log.userName} (${log.role})</td>
                      <td class="py-3 px-3">${log.department}</td>
                      <td class="py-3 px-3">${a ? a.name : log.assetId}</td>
                      <td class="py-3 px-3 text-center font-bold">${log.qty}</td>
                      <td class="py-3 px-3 text-right font-bold">${formatINR(log.qty * log.unitPrice)}</td>
                    </tr>
                  `;
                }).join('')}
              </tbody>
            </table>
          </div>
        `;
      }

      if (tab === 'valuation') {
        return `
          <div class="overflow-x-auto">
            <table class="w-full text-left text-xs">
              <thead class="bg-slate-100 text-slate-700 font-bold border-y border-slate-200">
                <tr>
                  <th class="py-3 px-3">Asset Code</th>
                  <th class="py-3 px-3">Asset Name</th>
                  <th class="py-3 px-3">Category</th>
                  <th class="py-3 px-3 text-center">Available Stock</th>
                  <th class="py-3 px-3 text-right">Unit Price</th>
                  <th class="py-3 px-3 text-right">Total Gross Valuation</th>
                </tr>
              </thead>
              <tbody class="divide-y divide-slate-200">
                ${state.assets.map(a => `
                  <tr>
                    <td class="py-3 px-3 font-mono font-bold">${a.code}</td>
                    <td class="py-3 px-3 font-bold">${a.name}</td>
                    <td class="py-3 px-3">${a.categoryId}</td>
                    <td class="py-3 px-3 text-center font-bold">${a.stock}</td>
                    <td class="py-3 px-3 text-right">${formatINR(a.unitPrice)}</td>
                    <td class="py-3 px-3 text-right font-bold text-brand-navy">${formatINR(a.stock * a.unitPrice)}</td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        `;
      }

      const lowItems = state.assets.filter(a => a.stock <= a.minStock);
      return `
        <div class="overflow-x-auto">
          <table class="w-full text-left text-xs">
            <thead class="bg-rose-50 text-rose-900 font-bold border-y border-rose-200">
              <tr>
                <th class="py-3 px-3">Asset Code</th>
                <th class="py-3 px-3">Asset Name</th>
                <th class="py-3 px-3 text-center">Current Stock</th>
                <th class="py-3 px-3 text-center">Minimum Threshold</th>
                <th class="py-3 px-3 text-center">Shortfall Qty</th>
                <th class="py-3 px-3 text-right">Est. Reorder Cost</th>
              </tr>
            </thead>
            <tbody class="divide-y divide-slate-200">
              ${lowItems.map(a => {
                const shortfall = Math.max(1, (a.minStock * 2) - a.stock);
                return `
                  <tr>
                    <td class="py-3 px-3 font-mono font-bold">${a.code}</td>
                    <td class="py-3 px-3 font-bold">${a.name}</td>
                    <td class="py-3 px-3 text-center font-bold text-rose-600">${a.stock}</td>
                    <td class="py-3 px-3 text-center">${a.minStock}</td>
                    <td class="py-3 px-3 text-center font-bold">${shortfall}</td>
                    <td class="py-3 px-3 text-right font-bold">${formatINR(shortfall * a.unitPrice)}</td>
                  </tr>
                `;
              }).join('')}
            </tbody>
          </table>
        </div>
      `;
    }

    function exportCurrentReportXLSX() {
      if (currentReportTab === 'audit') {
        exportSheetXLSX(
          'Requisition_Audit_Report.xlsx',
          'AuditTrail',
          ['Req ID', 'Requester', 'Department', 'Asset', 'Requested', 'Issued', 'Status'],
          state.requisitions.map(r => [r.id, r.requesterName, r.department, getAsset(r.assetId)?.name || r.assetId, r.qty, r.issuedQty, r.status])
        );
      } else if (currentReportTab === 'consumption') {
        exportSheetXLSX(
          'Consumption_Ledger.xlsx',
          'Consumption',
          ['Slip ID', 'Date', 'Req ID', 'Issued To', 'Role', 'Department', 'Asset', 'Qty', 'Total Cost'],
          state.issueLogs.map(l => [l.id, l.date, l.reqId, l.userName, l.role, l.department, getAsset(l.assetId)?.name || l.assetId, l.qty, l.qty * l.unitPrice])
        );
      } else {
        exportSheetXLSX(
          'Stock_Valuation_Report.xlsx',
          'Valuation',
          ['Code', 'Asset Name', 'Category', 'Stock', 'Min Stock', 'Unit Price', 'Valuation'],
          state.assets.map(a => [a.code, a.name, a.categoryId, a.stock, a.minStock, a.unitPrice, a.stock * a.unitPrice])
        );
      }
    }

    // =========================================================================
    // 15. INITIALIZE APPLICATION ON LOAD
    // =========================================================================
    window.addEventListener('DOMContentLoaded', () => {
      document.getElementById('active-role-select').value = state.activeRole;
      updateGlobalBadges();
      navigate(state.activeView || 'dashboard');
    });
  </script>
</body>
</html>
