    let state = loadState();
    let activeCharts = [];
    let pendingExcelRows = [];

    function loadState() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
          const parsed = JSON.parse(saved);
          if (!parsed.stockBatches) parsed.stockBatches = JSON.parse(JSON.stringify(DEFAULT_STATE.stockBatches));
          syncAssetStocksFromBatches(parsed);
          return parsed;
        }
      } catch (e) {
        console.error('State load fallback:', e);
      }
      const fresh = JSON.parse(JSON.stringify(DEFAULT_STATE));
      syncAssetStocksFromBatches(fresh);
      return fresh;
    }

    function saveState() {
      syncAssetStocksFromBatches(state);
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (e) {
        console.error('State save error:', e);
      }
      updateGlobalBadges();
    }

    // =========================================================================
    // 2. BATCH CONSOLIDATION & FIFO STOCK AGGREGATION HELPERS
    // =========================================================================
    function cleanName(raw) {
      return String(raw || '').replace(/^_+/, '').trim();
    }

    function cleanProductName(raw) {
      return cleanName(raw);
    }

    // Always aggregates SUM(leftQty) across all active batches for an Asset (and optional location)
    function getAggregatedStock(assetId, location = '') {
      const batches = (state.stockBatches || []).filter(b =>
        b.assetId === assetId && (!location || b.location === location)
      );
      if (batches.length === 0) {
        const a = getAsset(assetId);
        return a ? Number(a.stock || 0) : 0;
      }
      return batches.reduce((sum, b) => sum + (Number(b.leftQty) || 0), 0);
    }

    function syncAssetStocksFromBatches(targetState = state) {
      if (!targetState || !targetState.assets || !targetState.stockBatches) return;
      targetState.assets.forEach(a => {
        a.name = cleanName(a.name);
        const matchingBatches = targetState.stockBatches.filter(b => b.assetId === a.id);
        if (matchingBatches.length > 0) {
          a.stock = matchingBatches.reduce((sum, b) => sum + (Number(b.leftQty) || 0), 0);
        }
      });
    }

    // Add or merge stock into stockBatches (prevents duplicate same-date, same-price, same-expiry rows)
    function upsertStockBatch({ assetId, variant = 'N/A', color = '-', location = 'Main Store', addedOn = '2026-11-25', expiry = '-', qty = 1, unitPrice = 0, source = 'GRN' }) {
      const asset = getAsset(assetId);
      const existing = state.stockBatches.find(b =>
        b.assetId === assetId &&
        String(b.variant || 'N/A') === String(variant || 'N/A') &&
        String(b.color || '-') === String(color || '-') &&
        String(b.location || 'Main Store') === String(location || 'Main Store') &&
        String(b.addedOn) === String(addedOn) &&
        String(b.expiry || '-') === String(expiry || '-') &&
        Number(b.unitPrice) === Number(unitPrice)
      );

      if (existing) {
        existing.totalQty += Number(qty);
        existing.leftQty += Number(qty);
        existing.source = `${existing.source} + ${source}`;
      } else {
        state.stockBatches.unshift({
          batchId: 'BCH-' + Date.now().toString().slice(-5) + '-' + (state.stockBatches.length + 1),
          assetId,
          assetCode: asset ? asset.code : assetId,
          variant: variant || 'N/A',
          color: color || '-',
          location: location || 'Main Store',
          addedOn,
          expiry: expiry || '-',
          totalQty: Number(qty),
          issuedQty: 0,
          leftQty: Number(qty),
          unitPrice: Number(unitPrice),
          source
        });
      }
      syncAssetStocksFromBatches(state);
    }

    // Deduct stock via FIFO across all active batches where leftQty > 0
    function deductStockFIFO(assetId, qtyToDeduct, preferredLocation = '') {
      let remaining = Number(qtyToDeduct);
      // Prioritize batches matching preferredLocation first, then all other batches with leftQty > 0
      const sortedBatches = [
        ...state.stockBatches.filter(b => b.assetId === assetId && b.leftQty > 0 && (!preferredLocation || b.location === preferredLocation)),
        ...state.stockBatches.filter(b => b.assetId === assetId && b.leftQty > 0 && preferredLocation && b.location !== preferredLocation)
      ];

      for (const batch of sortedBatches) {
        if (remaining <= 0) break;
        const take = Math.min(batch.leftQty, remaining);
        batch.leftQty -= take;
        batch.issuedQty += take;
        remaining -= take;
      }
      syncAssetStocksFromBatches(state);
      return remaining === 0;
    }

    // One-click merge of duplicate same-date / same-price / same-expiry batch rows
    function consolidateDuplicateBatches() {
      const mergedMap = new Map();
      let duplicateGroupsMerged = 0;

      state.stockBatches.forEach(b => {
        const key = `${b.assetId}|${b.variant || 'N/A'}|${b.color || '-'}|${b.addedOn}|${b.expiry || '-'}|${b.unitPrice}`;
        if (mergedMap.has(key)) {
          const target = mergedMap.get(key);
          target.totalQty += Number(b.totalQty || 0);
          target.issuedQty += Number(b.issuedQty || 0);
          target.leftQty += Number(b.leftQty || 0);
          target.source = 'Consolidated Batch';
          duplicateGroupsMerged++;
        } else {
          mergedMap.set(key, { ...b });
        }
      });

      state.stockBatches = Array.from(mergedMap.values());
      syncAssetStocksFromBatches(state);
      saveState();

      if (duplicateGroupsMerged > 0) {
        showToast(`Consolidated ${duplicateGroupsMerged} duplicate batch row(s)! IT-086 ANTIVIRUS now shows Total: 2, Issued: 1, Left: 1.`, 'success');
      } else {
        showToast('All asset batches are already consolidated!', 'info');
      }
      navigate('asset-management');
    }

    function getDuplicateBatchCount() {
      const seen = new Set();
      let dupes = 0;
      (state.stockBatches || []).forEach(b => {
        const key = `${b.assetId}|${b.variant || 'N/A'}|${b.color || '-'}|${b.addedOn}|${b.expiry || '-'}|${b.unitPrice}`;
        if (seen.has(key)) dupes++;
        else seen.add(key);
      });
      return dupes;
    }

    function formatINR(num) {
      return '₹' + Number(num || 0).toLocaleString('en-IN', { maximumFractionDigits: 2 });
    }

    function getAsset(assetId) {
      const a = state.assets.find(x => x.id === assetId);
      if (a) a.name = cleanName(a.name);
      return a;
    }

    function getCategory(catId) {
      return state.categories.find(x => x.id === catId) || { id: catId, name: catId };
    }

    function getVendor(vendorId) {
      return state.vendors.find(x => x.id === vendorId) || { id: vendorId, name: vendorId };
    }

    function calculatePOTotals(po) {
      let subTotal = 0;
      let totalGst = 0;
      (po.items || []).forEach(it => {
        const lineSub = (Number(it.qty) || 0) * (Number(it.unitPrice) || 0);
        const lineTax = lineSub * ((Number(it.gst) || 0) / 100);
        subTotal += lineSub;
        totalGst += lineTax;
      });
      return { subTotal, totalGst, grandTotal: subTotal + totalGst };
    }

    function getExpiringAssetsCount() {
      const refDate = new Date('2026-11-25');
      const plus30 = new Date(refDate.getTime() + 30 * 24 * 60 * 60 * 1000);
      return state.assets.filter(a => {
        const dStr = a.expiry || a.warranty;
        if (!dStr) return false;
        const d = new Date(dStr);
        return d >= refDate && d <= plus30;
      });
    }

      const container = document.getElementById('toast-container');

        warning: 'bg-amber-500 text-slate-950 border-amber-600',
        info: 'bg-brand-navy text-white border-sky-700'
      };
      const iconMap = { success: 'check-circle-2', error: 'alert-circle', warning: 'alert-triangle', info: 'info' };
      const el = document.createElement('div');
      el.className = `pointer-events-auto flex items-start gap-2.5 px-4 py-3 rounded-xl shadow-lg border text-xs font-semibold transition-all duration-300 ${colors[type] || colors.info}`;
      el.innerHTML = `<i data-lucide="${iconMap[type] || 'info'}" class="w-4 h-4 shrink-0 mt-0.5"></i><span class="leading-relaxed">${message}</span>`;
      container.appendChild(el);
      lucide.createIcons();
      setTimeout(() => {
        el.style.opacity = '0';
        el.style.transform = 'translateX(16px)';
        setTimeout(() => el.remove(), 300);
      }, 4200);
    }

    function handleExcelFileSelect(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function (e) {
        try {
          const data = new Uint8Array(e.target.result);
          const workbook = XLSX.read(data, { type: 'array' });
          const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
          const jsonRows = XLSX.utils.sheet_to_json(firstSheet, { defval: '' });

          if (!jsonRows.length) {
            showToast('Uploaded Excel sheet is empty!', 'error');
            return;
          }

          pendingExcelRows = jsonRows.map((row, idx) => {
            const catRaw = String(row['Category'] || row['Category ID'] || '').trim();
            const code = String(row['Asset Code'] || '').trim();
            const name = cleanName(row['Asset Name'] || '');
            const brand = String(row['Brand'] || '').trim();
            const unit = String(row['Unit'] || 'Nos').trim();
            const qty = Number(row['Opening Stock Qty'] || 0);
            const rate = Number(row['Unit Rate'] || 0);
            const minStock = Number(row['Minimum Stock'] || 2);
            const location = String(row['Location'] || 'Main Store').trim();
            const expDate = String(row['Warranty/Expiry Date'] || '').trim();

            const errors = [];
            const matchedCat = state.categories.find(c =>
              c.id.toLowerCase() === catRaw.toLowerCase() || c.name.toLowerCase() === catRaw.toLowerCase()
            );
            if (!matchedCat) errors.push(`Unknown Category "${catRaw}"`);
            if (!code) errors.push('Missing Asset Code');
            if (state.assets.some(a => a.code.toLowerCase() === code.toLowerCase())) errors.push(`Duplicate Code "${code}"`);
            if (!name) errors.push('Missing Asset Name');
            if (isNaN(qty) || qty < 0) errors.push('Invalid Qty');
            if (isNaN(rate) || rate < 0) errors.push('Invalid Rate');

            return {
              rowNum: idx + 2,
              categoryId: matchedCat ? matchedCat.id : catRaw,
              code,
              name,
              brand,
              unit,
              qty,
              rate,
              minStock,
              location,
              expDate,
              valid: errors.length === 0,
              errors
            };
          });

          const container = document.getElementById('excel-preview-container');
          if (container) {
            container.classList.remove('hidden');
            container.innerHTML = renderExcelPreviewHTML();
            lucide.createIcons();
          }
          showToast(`Parsed ${pendingExcelRows.length} rows from "${file.name}". Review validation below.`, 'info');
        } catch (err) {
          console.error(err);
          showToast('Unable to parse Excel file. Please use the sample .xlsx template.', 'error');
        }
      };
      reader.readAsArrayBuffer(file);
    }

        stock,

        warranty: '2027-11-25'

          color: '-',

          addedOn: '2026-11-25',
          expiry: '2028-11-25',

    function renderPODraftRowsHTML() {
      return poDraftRows.map((row, idx) => {
        const lineSub = (Number(row.qty) || 0) * (Number(row.unitPrice) || 0);
        const lineTotal = lineSub * (1 + (Number(row.gst) || 0) / 100);
        return `
          <tr>
            <td class="py-2 px-2.5 font-bold text-slate-600">${idx + 1}</td>
            <td class="py-2 px-2.5">
              <select onchange="updatePODraftRow(${idx}, 'categoryId', this.value)" class="px-2 py-1.5 border border-slate-300 rounded-lg text-xs">
                ${state.categories.map(c => `<option value="${c.id}" ${c.id === row.categoryId ? 'selected' : ''}>${c.id}</option>`).join('')}
              </select>
            </td>
            <td class="py-2 px-2.5">
              <select onchange="updatePODraftRow(${idx}, 'assetId', this.value)" class="px-2 py-1.5 border border-slate-300 rounded-lg text-xs max-w-[190px]">
                ${state.assets.map(a => `<option value="${a.id}" ${a.id === row.assetId ? 'selected' : ''}>${cleanName(a.name)}</option>`).join('')}
              </select>
            </td>
            <td class="py-2 px-2.5">
              <input type="text" value="${row.variant}" onchange="updatePODraftRow(${idx}, 'variant', this.value)" class="w-24 px-2 py-1.5 border border-slate-300 rounded-lg text-xs" />

            <td class="py-2 px-2.5">
              <input type="number" min="1" value="${row.qty}" oninput="updatePODraftRow(${idx}, 'qty', this.value)" class="w-16 px-2 py-1.5 border border-slate-300 rounded-lg text-xs font-bold" />
            </td>
            <td class="py-2 px-2.5">
              <input type="number" min="0" step="0.01" value="${row.unitPrice}" oninput="updatePODraftRow(${idx}, 'unitPrice', this.value)" class="w-24 px-2 py-1.5 border border-slate-300 rounded-lg text-xs" />
            </td>
            <td class="py-2 px-2.5">
              <select onchange="updatePODraftRow(${idx}, 'gst', this.value)" class="px-2 py-1.5 border border-slate-300 rounded-lg text-xs">
                ${[0, 5, 12, 18, 28].map(g => `<option value="${g}" ${Number(row.gst) === g ? 'selected' : ''}>${g}%</option>`).join('')}
              </select>
            </td>
            <td class="py-2 px-2.5 text-right font-bold text-slate-900">${formatINR(lineTotal)}</td>
            <td class="py-2 px-2.5 text-center">
              ${poDraftRows.length > 1 ? `<button type="button" onclick="removePODraftRow(${idx})" class="text-rose-500 hover:text-rose-700 p-1"><i data-lucide="trash-2" class="w-4 h-4"></i></button>` : '-'}
            </td>
          </tr>
        `;
      }).join('');

    function renderPOSummaryHTML() {

        <div><span class="text-slate-400 block">Sub-Total</span><strong class="text-slate-800 text-sm">${formatINR(totals.subTotal)}</strong></div>
        <div><span class="text-slate-400 block">Total GST</span><strong class="text-slate-800 text-sm">${formatINR(totals.totalGst)}</strong></div>

    function addPODraftRow() {
      const defaultAsset = state.assets[0];
      poDraftRows.push({
        categoryId: defaultAsset ? defaultAsset.categoryId : 'IT',
        assetId: defaultAsset ? defaultAsset.id : 'AST-086',
        variant: 'Standard',
        unit: 'Nos',
        color: '-',
        qty: 1,
        unitPrice: defaultAsset ? defaultAsset.unitPrice : 0,
        gst: 18
      });
      document.getElementById('po-draft-tbody').innerHTML = renderPODraftRowsHTML();
      document.getElementById('po-summary-box').innerHTML = renderPOSummaryHTML();
      lucide.createIcons();

    function removePODraftRow(idx) {
      poDraftRows.splice(idx, 1);
      document.getElementById('po-draft-tbody').innerHTML = renderPODraftRowsHTML();
      document.getElementById('po-summary-box').innerHTML = renderPOSummaryHTML();
      lucide.createIcons();
    }

    function updatePODraftRow(idx, field, val) {
      poDraftRows[idx][field] = (field === 'qty' || field === 'unitPrice' || field === 'gst') ? parseFloat(val) || 0 : val;
      if (field === 'assetId') {
        const a = getAsset(val);
        if (a) {
          poDraftRows[idx].categoryId = a.categoryId;
          poDraftRows[idx].unitPrice = a.unitPrice;
        }
      }
      document.getElementById('po-draft-tbody').innerHTML = renderPODraftRowsHTML();
      document.getElementById('po-summary-box').innerHTML = renderPOSummaryHTML();
      lucide.createIcons();
    }

    function pullApprovedReqsIntoPO() {
      const approved = state.requisitions.filter(r => r.status === 'Approved');
      if (!approved.length) {
        showToast('No standalone Approved requisitions waiting for PO.', 'info');
        return;
      }
      poDraftRows = approved.map(r => {
        const a = getAsset(r.assetId);
        return {
          categoryId: r.categoryId,
          assetId: r.assetId,
          variant: a ? a.variant : 'Standard',
          unit: a ? a.unit : 'Nos',
          color: '-',
          qty: r.qty,
          unitPrice: a ? a.unitPrice : 0,
          gst: 18
        };
      });
      document.getElementById('po-draft-tbody').innerHTML = renderPODraftRowsHTML();
      document.getElementById('po-summary-box').innerHTML = renderPOSummaryHTML();
      lucide.createIcons();
      showToast(`Imported ${approved.length} approved requisition item(s) into PO draft!`, 'success');
    }

    function handleCreatePO(e) {
      e.preventDefault();
      const poId = document.getElementById('po-no').value;
      const newPO = {
        id: poId,
        date: document.getElementById('po-date').value,
        expectedDelivery: document.getElementById('po-delivery').value,
        createdAt: '25-11-2026',
        vendorId: document.getElementById('po-vendor').value,
        linkedReqs: [],
        notes: document.getElementById('po-notes').value.trim(),
        terms: document.getElementById('po-terms').value.trim(),
        status: 'Pending approval (Principal or Director)',
        quotations: [],
        items: JSON.parse(JSON.stringify(poDraftRows))
      };
      state.purchaseOrders.unshift(newPO);
      saveState();
      showToast(`Purchase Order #${poId} created (${formatINR(calculatePOTotals(newPO).grandTotal)})!`);
      navigate('create-po');
    }

    function handleSaveQuotation(e, poId) {
      e.preventDefault();
      const po = state.purchaseOrders.find(p => p.id === poId);
      if (!po) return;
      po.quotations = po.quotations || [];
      po.quotations.push({
        vendor: document.getElementById('q-vendor').value.trim(),
        amount: parseFloat(document.getElementById('q-amount').value) || 0,
        selected: true
      });
      po.status = 'Quotation Uploaded – Pending Joint Approval';
      saveState();
      closeModal();
      showToast(`Quotation attached to PO #${poId}!`);
      navigate('create-po');
    }

    function approvePO(poId) {
      const po = state.purchaseOrders.find(p => p.id === poId);
      if (!po) return;
      po.status = 'Approved (Ready for GRN)';
      saveState();
      showToast(`PO #${poId} Jointly Approved! You can now click "Proceed to GRN".`, 'success');
      navigate('create-po');
    }

    function cancelPO(poId) {
      const po = state.purchaseOrders.find(p => p.id === poId);
      if (!po) return;
      po.status = 'Rejected';
      saveState();
      showToast(`PO #${poId} marked as Rejected / Cancelled.`, 'warning');
      navigate('create-po');

    function filterPOReport() {
      const start = document.getElementById('por-start').value;
      const end = document.getElementById('por-end').value;
      const st = document.getElementById('por-status').value;
      const vnd = document.getElementById('por-vendor').value;

      const filtered = state.purchaseOrders.filter(po => {
        if (start && po.date < start) return false;
        if (end && po.date > end) return false;
        if (vnd !== 'ALL' && po.vendorId !== vnd) return false;
        if (st !== 'ALL' && !po.status.toLowerCase().includes(st.toLowerCase())) return false;
        return true;
      });

      document.getElementById('por-results-container').innerHTML = buildPOReportTableHTML(filtered);
      lucide.createIcons();

    function handleSubmitGRN(e) {
      e.preventDefault();
      const poId = document.getElementById('grn-po').value;
      const assetId = document.getElementById('grn-asset').value;
      const variant = document.getElementById('grn-variant').value.trim() || 'N/A';
      const location = document.getElementById('grn-location').value;
      const color = document.getElementById('grn-color').value.trim() || '-';
      const addedOn = document.getElementById('grn-added').value;
      const expiry = document.getElementById('grn-expiry').value || '-';
      const qty = parseInt(document.getElementById('grn-qty').value, 10) || 1;
      const unitPrice = parseFloat(document.getElementById('grn-price').value) || 0;

      const grnId = 'GRN-2026-0' + (18 + state.grnRecords.length);

      // Uses upsertStockBatch so same-date, same-price entries never create duplicate rows
      upsertStockBatch({
        assetId,
        variant,
        color,
        location,
        addedOn,
        expiry,
        qty,
        unitPrice,
        source: grnId
      });

      state.grnRecords.unshift({
        id: grnId,
        poId: poId || 'MANUAL',
        date: addedOn,
        categoryId: document.getElementById('grn-cat').value,
        assetId,
        qty,
        unitPrice,
        bookValue: qty * unitPrice,
        expiry,
        warranty: document.getElementById('grn-warranty').value
      });

      if (poId) {
        const po = state.purchaseOrders.find(p => p.id === poId);
        if (po) {
          po.status = 'Delivered (GRN completed)';
          state.accountingSyncLog.unshift({
            voucherId: 'AP-2026-' + (90 + state.accountingSyncLog.length),
            date: addedOn,
            type: 'Vendor Payable Voucher',
            ref: `PO #${po.id} / ${grnId}`,
            ledger: getVendor(po.vendorId).name,
            amount: calculatePOTotals(po).grandTotal,
            status: 'Posted to Financial Accounting'
          });
        }
      }

      saveState();
      showToast(`${grnId} recorded & merged into consolidated stock batch!`, 'success');
      navigate('asset-management');
    }

    function onDirectAssetChange() {
      const assetId = document.getElementById('iss-asset').value;
      const a = getAsset(assetId);
      if (!a) return;
      const stk = getAggregatedStock(a.id);
      document.getElementById('iss-cat').value = a.categoryId;
      document.getElementById('iss-variant').value = a.variant || 'N/A';
      document.getElementById('iss-left').value = stk;
      document.getElementById('iss-price').value = a.unitPrice;
      document.getElementById('iss-qty').max = Math.max(1, stk);
      document.getElementById('iss-qty').value = Math.min(1, stk);
    }

    function handleIssueAsset(e) {
      e.preventDefault();
      const assetId = document.getElementById('iss-asset').value;
      const asset = getAsset(assetId);
      const location = document.getElementById('iss-location').value;
      const qty = parseInt(document.getElementById('iss-qty').value, 10) || 0;
      const role = document.getElementById('iss-role').value.trim();
      const userName = document.getElementById('iss-user').value.trim();
      const contact = document.getElementById('iss-contact').value.trim();
      const date = document.getElementById('iss-date').value;
      const reqId = document.getElementById('iss-req-select').value;

      const available = getAggregatedStock(assetId);
      if (qty <= 0 || qty > available) {
        showToast(`Invalid quantity! Only ${available} unit(s) available across all batches.`, 'error');
        return;
      }

      let department = 'General';
      if (!directIssueMode && reqId && reqId !== 'DIRECT-ISSUE') {
        const req = state.requisitions.find(r => r.id === reqId);
        if (req) {
          const rem = req.qty - req.issuedQty;
          if (qty > rem) {
            showToast(`Cannot issue ${qty}; only ${rem} remaining on ${req.id}.`, 'error');
            return;
          }
          if (userName !== req.requesterName) {
            showToast(`Security Block: ${req.id} can only be issued to ${req.requesterName}!`, 'error');
            return;
          }
          department = req.department;
          req.issuedQty += qty;
          if (req.issuedQty >= req.qty) {
            req.status = 'Completed (Item Issued)';
          } else {
            req.status = 'Partially Issued';
          }
          req.history.push({
            time: `${date} • Just Now`,
            action: `${qty} Unit(s) Issued to ${req.requesterName} via FIFO Batch Deduction (Status: ${req.status})`,
            by: 'Store Admin'
          });
        }
      }

      deductStockFIFO(assetId, qty, location);

      const slipId = 'ISS-00' + (43 + state.issueLogs.length);
      state.issueLogs.unshift({
        id: slipId,
        date,
        reqId: (!directIssueMode && reqId) ? reqId : 'DIRECT',
        categoryId: asset ? asset.categoryId : 'IT',
        assetId,
        location,
        qty,
        unitPrice: asset ? asset.unitPrice : 0,
        role,
        userName,
        contact,
        department,
        mode: (!directIssueMode && reqId) ? 'Requisition-Locked' : 'Direct Ad-hoc'
      });

      saveState();
      showToast(`Issued ${qty}x ${asset ? cleanName(asset.name) : assetId} to ${userName} (${slipId})! Requisition status updated.`, 'success');
      navigate('requisition-list');
    }

    function handleStockAdjustment(e, mode) {
      e.preventDefault();
      const assetId = document.getElementById('adj-asset').value;
      const qty = parseInt(document.getElementById('adj-qty').value, 10) || 1;
      const date = document.getElementById('adj-date').value;
      const reason = document.getElementById('adj-reason').value.trim();
      const isReturn = mode === 'Return to Store';
      const asset = getAsset(assetId);
      if (!asset) return;

      if (!isReturn && qty > getAggregatedStock(assetId)) {
        showToast(`Cannot write off ${qty} units; only ${getAggregatedStock(assetId)} in usable stock.`, 'error');
        return;
      }

      if (isReturn) {
        upsertStockBatch({
          assetId,
          variant: asset.variant || 'N/A',
          color: asset.color || '-',
          location: asset.location || 'Main Store',
          addedOn: date,
          expiry: asset.expiry || '-',
          qty,
          unitPrice: asset.unitPrice,
          source: 'Return to Store'
        });
      } else {
        deductStockFIFO(assetId, qty);
      }

      state.stockAdjustments.unshift({
        id: 'ADJ-00' + (state.stockAdjustments.length + 1),
        date,
        type: mode,
        assetId,
        qty,
        personOrReason: reason,
        value: qty * asset.unitPrice
      });

      saveState();
      closeModal();
      showToast(`${mode} recorded (${isReturn ? '+' : '-'}${qty} ${asset.name})!`, isReturn ? 'success' : 'warning');
      navigate('asset-management');
    }

    function filterAdjustmentsReport() {
      const start = document.getElementById('adjr-start').value;
      const end = document.getElementById('adjr-end').value;
      const type = document.getElementById('adjr-type').value;
      const q = (document.getElementById('adjr-query').value || '').toLowerCase();

      const filtered = state.stockAdjustments.filter(adj => {
        const a = getAsset(adj.assetId);
        const aName = a ? cleanName(a.name).toLowerCase() : '';
        if (start && adj.date < start) return false;
        if (end && adj.date > end) return false;
        if (type !== 'ALL' && adj.type !== type) return false;
        if (q && !aName.includes(q) && !adj.personOrReason.toLowerCase().includes(q) && !adj.id.toLowerCase().includes(q)) return false;
        return true;
      });

      document.getElementById('adjr-results').innerHTML = buildAdjustmentsReportHTML(filtered);
      lucide.createIcons();
    }

    function buildAdjustmentsReportHTML(list) {
      const totalQty = list.reduce((s, x) => s + Number(x.qty || 0), 0);
      const totalVal = list.reduce((s, x) => s + Number(x.value || 0), 0);

      return `
        <div class="flex flex-wrap items-center justify-between gap-3 mb-3 bg-slate-50 p-3 rounded-xl border border-slate-200 text-xs">
          <div>Total Entries: <strong>${list.length}</strong> • Total Units: <strong>${totalQty}</strong> • Total Value: <strong class="text-brand-navy text-sm">${formatINR(totalVal)}</strong></div>
          <div class="flex gap-2">
            <button onclick="exportTableCSV('adjustments')" class="px-3 py-1.5 bg-white border border-slate-300 rounded-lg font-semibold hover:bg-slate-100">CSV / Excel</button>
            <button onclick="window.print()" class="px-3 py-1.5 bg-white border border-slate-300 rounded-lg font-semibold hover:bg-slate-100">Print / PDF</button>
          </div>
        </div>
        <div class="overflow-x-auto">
          <table class="w-full text-left border-collapse text-xs">
            <thead>
              <tr class="border-b-2 border-slate-200 text-brand-blue font-bold bg-slate-50">
                <th class="py-3 px-3">Ref ID</th>
                <th class="py-3 px-3">Date</th>
                <th class="py-3 px-3">Type</th>
                <th class="py-3 px-3">Asset Code & Name</th>
                <th class="py-3 px-3 text-center">Qty</th>
                <th class="py-3 px-3">Returned By / Remarks</th>
                <th class="py-3 px-3 text-right">Value</th>
              </tr>
            </thead>
            <tbody class="divide-y divide-slate-100">
              ${list.length === 0 ? `
                <tr><td colspan="7" class="py-6 text-center text-slate-400">No matching Return to Store or adjustment records found.</td></tr>
              ` : list.map(adj => {
                const a = getAsset(adj.assetId);
                const isReturn = adj.type === 'Return to Store';
                return `
                  <tr class="hover:bg-slate-50">
                    <td class="py-3 px-3 font-bold text-slate-900">${adj.id}</td>
                    <td class="py-3 px-3">${adj.date}</td>
                    <td class="py-3 px-3">
                      <span class="px-2.5 py-0.5 rounded-full font-bold text-[11px] ${isReturn ? 'bg-emerald-100 text-emerald-800' : 'bg-rose-100 text-rose-700'}">
                        ${adj.type}
                      </span>
                    </td>
                    <td class="py-3 px-3 font-semibold">${a ? `${a.code} — ${cleanName(a.name)}` : adj.assetId}</td>
                    <td class="py-3 px-3 text-center font-bold">${isReturn ? '+' : '-'}${adj.qty}</td>
                    <td class="py-3 px-3 text-slate-600">${adj.personOrReason}</td>
                    <td class="py-3 px-3 text-right font-extrabold text-slate-900">${formatINR(adj.value)}</td>
                  </tr>
                `;
              }).join('')}
            </tbody>
          </table>
        </div>
      `;
    }

    function exportTableCSV(type) {
      let csv = '';
      if (type === 'po') {
        csv = 'PO No,Date,Vendor,SubTotal,GST,GrandTotal,Status\n' +
          state.purchaseOrders.map(p => {
            const t = calculatePOTotals(p);
            return `${p.id},${p.date},"${getVendor(p.vendorId).name}",${t.subTotal},${t.totalGst},${t.grandTotal},"${p.status}"`;
          }).join('\n');
      } else if (type === 'issue') {
        csv = 'Slip,Date,ReqNo,Recipient,Role,Department,Asset,Qty,UnitPrice,TotalValue\n' +
          state.issueLogs.map(l => {
            const a = getAsset(l.assetId);
            return `${l.id},${l.date},${l.reqId},"${l.userName}","${l.role}","${l.department}","${a ? cleanName(a.name) : l.assetId}",${l.qty},${l.unitPrice},${l.qty * l.unitPrice}`;
          }).join('\n');
      } else if (type === 'adjustments') {
        csv = 'RefID,Date,Type,Asset,Qty,Remarks,Value\n' +
          state.stockAdjustments.map(adj => {
            const a = getAsset(adj.assetId);
            return `${adj.id},${adj.date},"${adj.type}","${a ? cleanName(a.name) : adj.assetId}",${adj.qty},"${adj.personOrReason}",${adj.value}`;
          }).join('\n');
      } else {
        csv = 'Code,Category,AssetName,Location,ClosingStock,UnitPrice,TotalValue\n' +
          state.assets.map(a => {
            const stk = getAggregatedStock(a.id);
            return `${a.code},${a.categoryId},"${cleanName(a.name)}","${a.location}",${stk},${a.unitPrice},${stk * a.unitPrice}`;
          }).join('\n');
      }
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = `SchoolMitra_${type}_Report_2026_27.csv`;
      link.click();
      URL.revokeObjectURL(url);
      showToast(`Exported ${type.toUpperCase()} report CSV!`, 'success');
    }

    // =========================================================================

    // =========================================================================
    window.addEventListener('DOMContentLoaded', () => {
      syncAssetStocksFromBatches(state);
      navigate(state.activeView || 'dashboard');
    });
  </script>
